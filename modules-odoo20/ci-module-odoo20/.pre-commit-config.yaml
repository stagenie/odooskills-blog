# Contrôles avant commit d'un dépôt de modules Odoo 20
default_language_version:
  python: python3.12
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-xml
      - id: check-yaml
      - id: check-toml
      - id: debug-statements
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: https://github.com/OCA/odoo-pre-commit-hooks
    rev: v0.2.27
    hooks:
      - id: oca-checks-odoo-module
  - repo: https://github.com/OCA/pylint-odoo
    rev: v10.0.12
    hooks:
      - id: pylint_odoo
        args:
          - --load-plugins=pylint_odoo
          - --disable=all
          - --enable=odoolint
          - --valid-odoo-versions=20.0
          - --disable=manifest-required-author,missing-readme
  - repo: local
    hooks:
      - id: odoo20-ir-model-access
        name: "Odoo 20 : plus de ir.model.access.csv"
        entry: "Odoo 20 lit les droits dans security/ir.access.csv (modèle ir.access)"
        language: fail
        files: ir\.model\.access\.csv$
      - id: odoo20-ir-rule
        name: "Odoo 20 : plus de ir.rule ni ir.model.access en XML"
        entry: 'model="ir\.(rule|model\.access)"'
        language: pygrep
        types: [xml]
