<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E5A86"/>
      <stop offset="0.55" stop-color="#714B67"/>
      <stop offset="1" stop-color="#4E2E48"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD98A"/>
      <stop offset="1" stop-color="#F2A93B"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>

  <!-- referral network links -->
  <g stroke="#F6E9F2" stroke-width="9" stroke-linecap="round" opacity="0.92" filter="url(#sh)">
    <line x1="104" y1="120" x2="60" y2="66"/>
    <line x1="104" y1="120" x2="60" y2="176"/>
    <line x1="104" y1="120" x2="176" y2="92"/>
  </g>

  <!-- satellite nodes -->
  <g filter="url(#sh)">
    <circle cx="60"  cy="66"  r="20" fill="#F6E9F2"/>
    <circle cx="60"  cy="176" r="20" fill="#F6E9F2"/>
    <circle cx="176" cy="92"  r="22" fill="#F6E9F2"/>
    <!-- central hub -->
    <circle cx="104" cy="120" r="30" fill="#FFFFFF"/>
    <circle cx="104" cy="120" r="30" fill="none" stroke="#714B67" stroke-width="6"/>
    <circle cx="104" cy="120" r="10" fill="#714B67"/>
  </g>

  <!-- commission coin with % -->
  <g filter="url(#sh)">
    <circle cx="176" cy="182" r="46" fill="url(#coin)"/>
    <circle cx="176" cy="182" r="46" fill="none" stroke="#C9871F" stroke-width="4"/>
    <g stroke="#7A4E12" stroke-width="9" stroke-linecap="round">
      <line x1="158" y1="200" x2="194" y2="164"/>
    </g>
    <circle cx="160" cy="166" r="8.5" fill="none" stroke="#7A4E12" stroke-width="8"/>
    <circle cx="192" cy="198" r="8.5" fill="none" stroke="#7A4E12" stroke-width="8"/>
  </g>
</svg>
