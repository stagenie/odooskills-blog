<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="20" y="36" font-size="24" font-weight="700" fill="#062b2d">Odoo 20 ou ERPNext : par où commencer l'examen</text>
  <rect x="270" y="56" width="460" height="46" rx="10" fill="#062b2d"/>
  <text x="500" y="86" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Qui fera tourner l'ERP au quotidien ?</text>
  <path d="M492 110 h16 l-8 12 z" fill="#94a3b8"/>

  <!-- Colonne gauche : l'éditeur -->
  <rect x="20" y="132" width="440" height="68" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="36" y="160" font-size="18" font-weight="700" fill="#065f46">L'éditeur, en ligne</text>
  <text x="36" y="186" font-size="16" fill="#334155">pas d'équipe technique, service hébergé</text>
  <rect x="20" y="244" width="440" height="70" rx="10" fill="#f7f2f6" stroke="#714B67" stroke-width="2"/>
  <text x="36" y="272" font-size="18" font-weight="700" fill="#714B67">Odoo 20 Enterprise sur Odoo Online</text>
  <text x="36" y="298" font-size="16" fill="#334155">licence par utilisateur, applications standard</text>
  <rect x="20" y="326" width="440" height="70" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
  <text x="36" y="354" font-size="18" font-weight="700" fill="#0369a1">ERPNext sur Frappe Cloud</text>
  <text x="36" y="380" font-size="16" fill="#334155">hébergement facturé, pas l'utilisateur</text>

  <!-- Colonne droite : équipe ou intégrateur -->
  <rect x="490" y="132" width="490" height="68" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="506" y="160" font-size="18" font-weight="700" fill="#065f46">Une équipe ou un intégrateur</text>
  <text x="506" y="186" font-size="16" fill="#334155">serveur propre ou loué, montées de version à sa charge</text>
  <text x="735" y="230" font-size="16" font-weight="700" fill="#062b2d" text-anchor="middle">Comptabilité et paie dans l'ERP, sans licence ?</text>
  <rect x="490" y="244" width="490" height="70" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
  <text x="506" y="272" font-size="18" font-weight="700" fill="#0369a1">Oui : ERPNext et Frappe HR</text>
  <text x="506" y="298" font-size="16" fill="#334155">GPL-3 ; adaptations françaises par une application tierce</text>
  <rect x="490" y="326" width="490" height="70" rx="10" fill="#f7f2f6" stroke="#714B67" stroke-width="2"/>
  <text x="506" y="354" font-size="18" font-weight="700" fill="#714B67">Non : Odoo 20 Community</text>
  <text x="506" y="380" font-size="16" fill="#334155">LGPL-3, 34 applications ; comptabilité tenue ailleurs</text>
  <rect x="490" y="408" width="490" height="70" rx="10" fill="#f7f2f6" stroke="#714B67" stroke-width="2"/>
  <text x="506" y="436" font-size="18" font-weight="700" fill="#714B67">Avec abonnement : Odoo 20 Enterprise</text>
  <text x="506" y="462" font-size="16" fill="#334155">plan Personnalisé, sur Odoo.sh ou serveur propre</text>

  <!-- Bandeau commun -->
  <rect x="20" y="500" width="960" height="94" rx="10" fill="#fff8e1"/>
  <rect x="20" y="500" width="8" height="94" fill="#d97706"/>
  <text x="44" y="530" font-size="19" font-weight="700" fill="#92400e">Pour une PME française, dans tous les cas</text>
  <text x="44" y="558" font-size="16" fill="#334155">Liste des plateformes agréées mise à jour le 9 novembre 2026 : Odoo y figure, ni Frappe ni ERPNext.</text>
  <text x="44" y="582" font-size="16" fill="#334155">Annuaires des éditeurs : 144 partenaires Odoo en France, 1 partenaire Frappe en France.</text>
</svg>
