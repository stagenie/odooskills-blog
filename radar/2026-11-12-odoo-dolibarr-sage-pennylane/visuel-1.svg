<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="20" y="36" font-size="24" font-weight="700" fill="#062b2d">Odoo 20, Dolibarr, Sage ou Pennylane : partir du besoin</text>
  <rect x="270" y="56" width="460" height="46" rx="10" fill="#062b2d"/>
  <text x="500" y="86" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Qu'attend la PME de son logiciel ?</text>
  <path d="M492 110 h16 l-8 12 z" fill="#94a3b8"/>

  <!-- Colonne 1 -->
  <rect x="20" y="132" width="300" height="68" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="36" y="160" font-size="18" font-weight="700" fill="#065f46">Comptabilité et finances</text>
  <text x="36" y="186" font-size="16" fill="#334155">avec l'expert-comptable</text>
  <rect x="20" y="214" width="300" height="70" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
  <text x="36" y="242" font-size="18" font-weight="700" fill="#0369a1">Pennylane</text>
  <text x="36" y="268" font-size="16" fill="#334155">gestion financière, en ligne</text>
  <rect x="20" y="296" width="300" height="70" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
  <text x="36" y="324" font-size="18" font-weight="700" fill="#0369a1">Sage 50</text>
  <text x="36" y="350" font-size="16" fill="#334155">packs jusqu'à 3 utilisateurs</text>

  <!-- Colonne 2 -->
  <rect x="350" y="132" width="300" height="68" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="366" y="160" font-size="18" font-weight="700" fill="#065f46">Compta et gestion commerciale</text>
  <text x="366" y="186" font-size="16" fill="#334155">chez un même éditeur</text>
  <rect x="350" y="214" width="300" height="70" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
  <text x="366" y="242" font-size="18" font-weight="700" fill="#0369a1">Sage 100</text>
  <text x="366" y="268" font-size="16" fill="#334155">ERP modulaire, offre sur mesure</text>
  <rect x="350" y="296" width="300" height="70" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
  <text x="366" y="324" font-size="18" font-weight="700" fill="#0369a1">Sage 50</text>
  <text x="366" y="350" font-size="16" fill="#334155">comptabilité et facturation</text>

  <!-- Colonne 3 -->
  <rect x="680" y="132" width="300" height="68" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="696" y="160" font-size="18" font-weight="700" fill="#065f46">Un ERP intégré</text>
  <text x="696" y="186" font-size="16" fill="#334155">toute l'entreprise, une base</text>
  <text x="830" y="232" font-size="16" font-weight="700" fill="#062b2d" text-anchor="middle">Héberger un logiciel libre ?</text>
  <rect x="680" y="244" width="300" height="62" rx="10" fill="#f7f2f6" stroke="#714B67" stroke-width="2"/>
  <text x="696" y="270" font-size="18" font-weight="700" fill="#714B67">Oui : Odoo 20 Community</text>
  <text x="696" y="294" font-size="16" fill="#334155">LGPL-3, sans app Comptabilité</text>
  <rect x="680" y="316" width="300" height="62" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
  <text x="696" y="342" font-size="18" font-weight="700" fill="#0369a1">Oui : Dolibarr</text>
  <text x="696" y="366" font-size="16" fill="#334155">GPL-3+, modules à activer</text>
  <rect x="680" y="388" width="300" height="62" rx="10" fill="#f7f2f6" stroke="#714B67" stroke-width="2"/>
  <text x="696" y="414" font-size="18" font-weight="700" fill="#714B67">Non : Odoo 20 Enterprise</text>
  <text x="696" y="438" font-size="16" fill="#334155">abonnement par utilisateur</text>

  <!-- Bandeau commun -->
  <rect x="20" y="474" width="960" height="118" rx="10" fill="#fff8e1"/>
  <rect x="20" y="474" width="8" height="118" fill="#d97706"/>
  <text x="44" y="504" font-size="19" font-weight="700" fill="#92400e">Dans tous les cas : la facture électronique</text>
  <text x="44" y="532" font-size="16" fill="#334155">Réception obligatoire depuis le 1er septembre 2026 ; émission des PME au 1er septembre 2027.</text>
  <text x="44" y="556" font-size="16" fill="#334155">Liste des plateformes agréées mise à jour le 9 novembre 2026 : Odoo, Pennylane et Sage y figurent.</text>
  <text x="44" y="580" font-size="16" fill="#334155">Dolibarr : module externe, au statut expérimental, vers des plateformes agréées tierces.</text>
  <text x="20" y="622" font-size="16" fill="#64748b">Un produit peut répondre à plusieurs besoins : le schéma indique par où commencer, pas un classement.</text>
</svg>
