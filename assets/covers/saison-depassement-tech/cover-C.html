<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Cover C — Terminal + graph perf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{--navy:#0c4a6e;--deep:#075985;--sky:#0369a1;--light:#e0f2fe;--green:#166534;--green-l:#22c55e;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:700px;overflow:hidden;font-family:'Inter',sans-serif;background:var(--navy);color:var(--light);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.hero{width:1920px;height:700px;position:relative;background:radial-gradient(ellipse at 70% 50%,rgba(3,105,161,.35) 0%,transparent 55%),linear-gradient(135deg,#0c4a6e 0%,#063a58 100%);overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(224,242,254,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(224,242,254,.035) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;mask-image:radial-gradient(ellipse at center,#000 35%,transparent 85%);-webkit-mask-image:radial-gradient(ellipse at center,#000 35%,transparent 85%)}
.hero::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 3px)}
.container{position:absolute;inset:0;padding:72px 100px;display:flex;flex-direction:column;justify-content:space-between;z-index:5}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.logo{display:inline-flex;align-items:center;gap:14px}
.logo-mark{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#e0f2fe 0%,#bae6fd 100%);color:#0c4a6e;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:26px;display:flex;align-items:center;justify-content:center;letter-spacing:-.06em;box-shadow:0 8px 24px rgba(14,165,233,.2),inset 0 1px 0 rgba(255,255,255,.6)}
.logo-text{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;color:var(--light);letter-spacing:.25em;opacity:.85;text-transform:uppercase}
.badge{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg,#166534 0%,#14532d 100%);color:#fff;font-size:13px;font-weight:600;letter-spacing:.22em;padding:11px 22px;border-radius:999px;text-transform:uppercase;box-shadow:0 6px 18px rgba(22,101,52,.4),inset 0 1px 0 rgba(255,255,255,.15);border:1px solid rgba(134,239,172,.25)}
.badge-dot{width:8px;height:8px;border-radius:50%;background:#86efac;box-shadow:0 0 10px #22c55e,0 0 4px #22c55e}
.text-block{max-width:920px;position:relative;z-index:6}
.eyebrow{display:inline-block;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;color:#7dd3fc;letter-spacing:.35em;margin-bottom:22px;text-transform:uppercase;opacity:.9}
.eyebrow::before{content:'//';color:#0ea5e9;margin-right:14px;opacity:.6}
.title{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:96px;line-height:.92;color:#fff;letter-spacing:-.035em;margin-bottom:28px}
.title .line2{color:var(--light);display:block}
.title .accent{color:#86efac;position:relative}
.subtitle{font-family:'Inter',sans-serif;font-weight:500;font-style:italic;font-size:27px;color:var(--light);opacity:.88;letter-spacing:.005em;line-height:1.3;max-width:720px}
.subtitle .sep{color:#0ea5e9;opacity:.75;margin:0 12px;font-style:normal;font-weight:400}
.bottom{display:flex;justify-content:space-between;align-items:flex-end}
.meta{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.32em;opacity:.7;text-transform:uppercase;color:var(--light)}
.meta .sep{color:#0ea5e9;margin:0 14px;opacity:.65}
.series-num{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--light);opacity:.55;letter-spacing:.2em}
.series-num span{color:#86efac;opacity:.9}
.illo{position:absolute;right:60px;top:50%;transform:translateY(-50%);width:880px;height:560px;z-index:3}
.noise{position:absolute;inset:0;pointer-events:none;opacity:.04;z-index:10;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.55'/></svg>")}
</style>
</head>
<body>
<div class="hero">
  <div class="noise"></div>

  <!-- Illustration: Terminal macOS + graph sparkline -->
  <svg class="illo" viewBox="0 0 880 560" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0b1220"/>
        <stop offset="100%" stop-color="#050a12"/>
      </linearGradient>
      <linearGradient id="termHeader" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1e293b"/>
        <stop offset="100%" stop-color="#111827"/>
      </linearGradient>
      <linearGradient id="graphBg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0c4a6e" stop-opacity="0.8"/>
        <stop offset="100%" stop-color="#053145" stop-opacity="0.4"/>
      </linearGradient>
      <linearGradient id="graphFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#22c55e" stop-opacity="0.45"/>
        <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
      </linearGradient>
      <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="18"/>
      </filter>
      <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="3"/>
      </filter>
    </defs>

    <!-- Drop shadow for terminal -->
    <rect x="50" y="60" width="720" height="340" rx="14" fill="rgba(0,0,0,0.55)" filter="url(#softShadow)"/>

    <!-- Terminal window -->
    <g>
      <!-- window body -->
      <rect x="40" y="50" width="720" height="340" rx="12" fill="url(#termBg)" stroke="#1e293b" stroke-width="1"/>
      <!-- header bar -->
      <rect x="40" y="50" width="720" height="36" rx="12" fill="url(#termHeader)"/>
      <rect x="40" y="80" width="720" height="6" fill="url(#termHeader)"/>
      <!-- bottom border line under header -->
      <line x1="40" y1="86" x2="760" y2="86" stroke="#0f172a" stroke-width="1"/>

      <!-- Traffic lights -->
      <circle cx="62" cy="68" r="6.5" fill="#ff5f57" stroke="#e0443e" stroke-width="0.5"/>
      <circle cx="82" cy="68" r="6.5" fill="#febc2e" stroke="#d6a022" stroke-width="0.5"/>
      <circle cx="102" cy="68" r="6.5" fill="#28c840" stroke="#1aa32e" stroke-width="0.5"/>

      <!-- Tab title -->
      <text x="400" y="72" text-anchor="middle" fill="#94a3b8" font-family="JetBrains Mono,monospace" font-size="12" letter-spacing="0.08em">~/odoo19-dev — bash — 120×32</text>

      <!-- Terminal content -->
      <g font-family="JetBrains Mono,monospace" font-size="13" letter-spacing="0.01em">
        <!-- Prompt line 1 -->
        <text x="60" y="115" fill="#7dd3fc">$</text>
        <text x="78" y="115" fill="#e2e8f0">./odoo-bin -i odooskills_helpdesk -d dev \</text>

        <!-- Continuation -->
        <text x="98" y="135" fill="#94a3b8">--test-enable --stop-after-init</text>

        <!-- Empty line -->

        <!-- Loading message -->
        <text x="60" y="162" fill="#94a3b8">INFO  </text>
        <text x="108" y="162" fill="#7dd3fc">dev</text>
        <text x="135" y="162" fill="#94a3b8"> odoo.modules.loading:</text>
        <text x="310" y="162" fill="#cbd5e1">loading odooskills_helpdesk</text>

        <!-- Test file progress -->
        <text x="60" y="188" fill="#94a3b8">tests</text>
        <text x="100" y="188" fill="#e2e8f0">.test_ticket  </text>
        <text x="200" y="188" fill="#86efac" font-weight="700">..............</text>
        <text x="350" y="188" fill="#cbd5e1">[</text>
        <text x="358" y="188" fill="#86efac">ok</text>
        <text x="378" y="188" fill="#cbd5e1">] 14</text>

        <text x="60" y="208" fill="#94a3b8">tests</text>
        <text x="100" y="208" fill="#e2e8f0">.test_wizard  </text>
        <text x="200" y="208" fill="#86efac" font-weight="700">........</text>
        <text x="290" y="208" fill="#cbd5e1">[</text>
        <text x="298" y="208" fill="#86efac">ok</text>
        <text x="318" y="208" fill="#cbd5e1">] 8</text>

        <text x="60" y="228" fill="#94a3b8">tests</text>
        <text x="100" y="228" fill="#e2e8f0">.test_controllers </text>
        <text x="230" y="228" fill="#86efac" font-weight="700">..............</text>
        <text x="380" y="228" fill="#cbd5e1">[</text>
        <text x="388" y="228" fill="#86efac">ok</text>
        <text x="408" y="228" fill="#cbd5e1">] 14</text>

        <text x="60" y="248" fill="#94a3b8">tests</text>
        <text x="100" y="248" fill="#e2e8f0">.test_mail_thread </text>
        <text x="230" y="248" fill="#86efac" font-weight="700">...........</text>
        <text x="350" y="248" fill="#cbd5e1">[</text>
        <text x="358" y="248" fill="#86efac">ok</text>
        <text x="378" y="248" fill="#cbd5e1">] 11</text>

        <!-- Separator -->
        <text x="60" y="275" fill="#475569">─────────────────────────────────────────────</text>

        <!-- Final -->
        <text x="60" y="298" fill="#e2e8f0">Ran </text>
        <text x="100" y="298" fill="#86efac" font-weight="700">47</text>
        <text x="118" y="298" fill="#e2e8f0"> tests in </text>
        <text x="180" y="298" fill="#86efac" font-weight="700">3.247s</text>

        <!-- OK line -->
        <text x="60" y="325" fill="#86efac" font-weight="800" font-size="15">OK</text>
        <text x="92" y="325" fill="#cbd5e1" font-size="13"> (passed=</text>
        <text x="160" y="325" fill="#86efac" font-weight="700">47</text>
        <text x="176" y="325" fill="#cbd5e1">, failed=</text>
        <text x="232" y="325" fill="#94a3b8">0</text>
        <text x="240" y="325" fill="#cbd5e1">, errors=</text>
        <text x="296" y="325" fill="#94a3b8">0</text>
        <text x="304" y="325" fill="#cbd5e1">)</text>

        <!-- Next prompt with blinking cursor -->
        <text x="60" y="356" fill="#7dd3fc">$</text>
        <rect x="80" y="344" width="10" height="16" fill="#86efac" opacity="0.9"/>
      </g>
    </g>

    <!-- ============ Graph card below terminal ============ -->
    <g transform="translate(40,420)">
      <!-- Card bg -->
      <rect x="0" y="0" width="720" height="120" rx="12" fill="url(#graphBg)" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.35"/>

      <!-- Header row -->
      <g transform="translate(24,24)">
        <text fill="#bae6fd" font-family="JetBrains Mono,monospace" font-size="11" letter-spacing="0.3em" font-weight="700">PERFORMANCE · REQUÊTES SQL / TICKET</text>
      </g>
      <!-- metric pill -->
      <g transform="translate(520,18)">
        <rect x="0" y="0" width="172" height="28" rx="14" fill="rgba(34,197,94,0.18)" stroke="#22c55e" stroke-width="1"/>
        <text x="14" y="18.5" fill="#86efac" font-family="JetBrains Mono,monospace" font-size="11" font-weight="700" letter-spacing="0.1em">−72% vs v17</text>
        <path d="M130,14 L148,6 M144,6 L148,6 L148,10" stroke="#86efac" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>

      <!-- Graph area -->
      <g transform="translate(24,52)">
        <!-- grid lines -->
        <g stroke="#0ea5e9" stroke-width="1" opacity="0.15">
          <line x1="0" y1="0" x2="672" y2="0"/>
          <line x1="0" y1="18" x2="672" y2="18"/>
          <line x1="0" y1="36" x2="672" y2="36"/>
          <line x1="0" y1="54" x2="672" y2="54"/>
        </g>

        <!-- Baseline curve (old, dashed) -->
        <path d="M 0 8 L 67 10 L 134 9 L 201 14 L 268 12 L 335 15 L 402 13 L 469 16 L 536 18 L 603 17 L 672 22" stroke="#64748b" stroke-width="1.5" fill="none" stroke-dasharray="4 4" opacity="0.55"/>

        <!-- Performance curve (descending = fewer queries) with area fill -->
        <path d="M 0 10 L 67 14 L 134 22 L 201 28 L 268 33 L 335 36 L 402 40 L 469 44 L 536 46 L 603 48 L 672 50 L 672 60 L 0 60 Z" fill="url(#graphFill)"/>
        <path d="M 0 10 L 67 14 L 134 22 L 201 28 L 268 33 L 335 36 L 402 40 L 469 44 L 536 46 L 603 48 L 672 50" stroke="#22c55e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowGreen)"/>
        <path d="M 0 10 L 67 14 L 134 22 L 201 28 L 268 33 L 335 36 L 402 40 L 469 44 L 536 46 L 603 48 L 672 50" stroke="#86efac" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Data points -->
        <g fill="#22c55e">
          <circle cx="0" cy="10" r="3"/>
          <circle cx="134" cy="22" r="3"/>
          <circle cx="268" cy="33" r="3"/>
          <circle cx="402" cy="40" r="3"/>
          <circle cx="536" cy="46" r="3"/>
          <circle cx="672" cy="50" r="4" stroke="#ecfdf5" stroke-width="1.5"/>
        </g>

        <!-- End label -->
        <g transform="translate(612,28)">
          <rect x="0" y="0" width="60" height="20" rx="4" fill="#166534" stroke="#4ade80" stroke-width="1"/>
          <text x="30" y="14" text-anchor="middle" fill="#ecfdf5" font-family="JetBrains Mono,monospace" font-size="10" font-weight="700">12 q</text>
        </g>
      </g>
    </g>

    <!-- Floating "OK" stamp top right -->
    <g transform="translate(620,20)">
      <circle cx="60" cy="60" r="52" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.4"/>
      <circle cx="60" cy="60" r="44" fill="none" stroke="#4ade80" stroke-width="1.5" opacity="0.55"/>
      <g transform="rotate(-8 60 60)">
        <text x="60" y="54" text-anchor="middle" fill="#86efac" font-family="JetBrains Mono,monospace" font-size="22" font-weight="800" letter-spacing="0.15em">PASS</text>
        <text x="60" y="74" text-anchor="middle" fill="#4ade80" font-family="JetBrains Mono,monospace" font-size="10" font-weight="700" letter-spacing="0.3em">47 / 47</text>
      </g>
    </g>

    <!-- Ambient code tokens -->
    <g font-family="JetBrains Mono,monospace" font-size="10" fill="#7dd3fc" opacity="0.35">
      <text x="20" y="30" letter-spacing="0.1em">TransactionCase · HttpCase · Form</text>
      <text x="490" y="30" letter-spacing="0.1em">@tagged · @users · @warmup</text>
    </g>
  </svg>

  <div class="container">
    <div class="top">
      <div class="logo">
        <div class="logo-mark">O.</div>
        <div class="logo-text">OdooSkills</div>
      </div>
      <div class="badge"><span class="badge-dot"></span>Saison finale</div>
    </div>
    <div class="text-block">
      <div class="eyebrow">Nouvelle série technique</div>
      <h1 class="title">
        DÉPASSEMENT
        <span class="line2">TECH <span class="accent">V19</span></span>
      </h1>
      <p class="subtitle">Tests<span class="sep">·</span>Migration<span class="sep">·</span>OWL<span class="sep">·</span>Bus<span class="sep">·</span>Performance</p>
    </div>
    <div class="bottom">
      <p class="meta">5 articles<span class="sep">·</span>Évergreen<span class="sep">·</span>Odoo 19</p>
      <p class="series-num">T<span>24</span> — T<span>28</span></p>
    </div>
  </div>
</div>
</body>
</html>
