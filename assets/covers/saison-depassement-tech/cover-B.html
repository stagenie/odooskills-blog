<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Cover B — Code 3D isométrique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Inter:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{--navy:#0c4a6e;--deep:#075985;--sky:#0369a1;--light:#e0f2fe;--green:#166534;--green-l:#22c55e;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:700px;overflow:hidden;font-family:'Inter',sans-serif;background:var(--navy);color:var(--light);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.hero{width:1920px;height:700px;position:relative;background:radial-gradient(ellipse at 70% 50%,rgba(3,105,161,.35) 0%,transparent 55%),linear-gradient(135deg,#0c4a6e 0%,#063a58 100%);overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(224,242,254,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(224,242,254,.035) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;mask-image:radial-gradient(ellipse at center,#000 35%,transparent 85%);-webkit-mask-image:radial-gradient(ellipse at center,#000 35%,transparent 85%)}
.hero::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 3px)}
.container{position:absolute;inset:0;padding:72px 100px;display:flex;flex-direction:column;justify-content:space-between;z-index:5}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.logo{display:inline-flex;align-items:center;gap:14px}
.logo-mark{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#e0f2fe 0%,#bae6fd 100%);color:#0c4a6e;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:26px;display:flex;align-items:center;justify-content:center;letter-spacing:-.06em;box-shadow:0 8px 24px rgba(14,165,233,.2),inset 0 1px 0 rgba(255,255,255,.6)}
.logo-text{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;color:var(--light);letter-spacing:.25em;opacity:.85;text-transform:uppercase}
.badge{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg,#166534 0%,#14532d 100%);color:#fff;font-size:13px;font-weight:600;letter-spacing:.22em;padding:11px 22px;border-radius:999px;text-transform:uppercase;box-shadow:0 6px 18px rgba(22,101,52,.4),inset 0 1px 0 rgba(255,255,255,.15);border:1px solid rgba(134,239,172,.25)}
.badge-dot{width:8px;height:8px;border-radius:50%;background:#86efac;box-shadow:0 0 10px #22c55e,0 0 4px #22c55e}
.text-block{max-width:920px;position:relative;z-index:6}
.eyebrow{display:inline-block;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;color:#7dd3fc;letter-spacing:.35em;margin-bottom:22px;text-transform:uppercase;opacity:.9}
.eyebrow::before{content:'//';color:#0ea5e9;margin-right:14px;opacity:.6}
.title{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:96px;line-height:.92;color:#fff;letter-spacing:-.035em;margin-bottom:28px}
.title .line2{color:var(--light);display:block}
.title .accent{color:#86efac;position:relative}
.subtitle{font-family:'Inter',sans-serif;font-weight:500;font-style:italic;font-size:27px;color:var(--light);opacity:.88;letter-spacing:.005em;line-height:1.3;max-width:720px}
.subtitle .sep{color:#0ea5e9;opacity:.75;margin:0 12px;font-style:normal;font-weight:400}
.bottom{display:flex;justify-content:space-between;align-items:flex-end}
.meta{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.32em;opacity:.7;text-transform:uppercase;color:var(--light)}
.meta .sep{color:#0ea5e9;margin:0 14px;opacity:.65}
.series-num{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--light);opacity:.55;letter-spacing:.2em}
.series-num span{color:#86efac;opacity:.9}
.illo{position:absolute;right:40px;top:50%;transform:translateY(-50%);width:860px;height:580px;z-index:3;opacity:.95}
.noise{position:absolute;inset:0;pointer-events:none;opacity:.04;z-index:10;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.55'/></svg>")}
</style>
</head>
<body>
<div class="hero">
  <div class="noise"></div>

  <!-- Illustration: 3D isometric stack of code blocks -->
  <svg class="illo" viewBox="0 0 860 580" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Face gradients for depth -->
      <linearGradient id="topPY" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#0ea5e9"/>
        <stop offset="100%" stop-color="#0369a1"/>
      </linearGradient>
      <linearGradient id="topXML" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#0284c7"/>
      </linearGradient>
      <linearGradient id="topOWL" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#7dd3fc"/>
        <stop offset="100%" stop-color="#0ea5e9"/>
      </linearGradient>
      <linearGradient id="topJSON" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#bae6fd"/>
        <stop offset="100%" stop-color="#38bdf8"/>
      </linearGradient>
      <linearGradient id="topTEST" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#4ade80"/>
        <stop offset="100%" stop-color="#166534"/>
      </linearGradient>
      <linearGradient id="leftFace" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#075985"/>
        <stop offset="100%" stop-color="#0c4a6e"/>
      </linearGradient>
      <linearGradient id="rightFace" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0c4a6e"/>
        <stop offset="100%" stop-color="#053145"/>
      </linearGradient>
      <linearGradient id="leftFaceTest" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#166534"/>
        <stop offset="100%" stop-color="#14532d"/>
      </linearGradient>
      <linearGradient id="rightFaceTest" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#14532d"/>
        <stop offset="100%" stop-color="#0a3a1f"/>
      </linearGradient>
      <radialGradient id="testHalo" cx=".5" cy=".5" r=".6">
        <stop offset="0%" stop-color="#22c55e" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
      </radialGradient>
      <filter id="blockShadow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="8"/>
      </filter>
    </defs>

    <!-- Ambient dots grid -->
    <g fill="#e0f2fe" opacity="0.08">
      <circle cx="80" cy="80" r="1.5"/><circle cx="130" cy="80" r="1.5"/><circle cx="180" cy="80" r="1.5"/>
      <circle cx="80" cy="130" r="1.5"/><circle cx="130" cy="130" r="1.5"/>
      <circle cx="780" cy="480" r="1.5"/><circle cx="730" cy="480" r="1.5"/>
      <circle cx="780" cy="530" r="1.5"/>
    </g>

    <!-- Ground shadow -->
    <ellipse cx="430" cy="530" rx="220" ry="22" fill="rgba(0,0,0,0.35)" filter="url(#blockShadow)"/>

    <!-- Isometric base grid hint -->
    <g stroke="#0ea5e9" stroke-width="1" opacity="0.12">
      <line x1="210" y1="515" x2="430" y2="405"/>
      <line x1="430" y1="515" x2="650" y2="405"/>
      <line x1="210" y1="515" x2="430" y2="625" stroke="none"/>
    </g>

    <!--
      Isometric slab:
      - Top face rhombus: width=220, height=110 (2:1 iso)
      - Thickness: 44 (Z projection)
      - Stack spacing: 58 (thickness + gap)

      Base slab center: (430, 480)
      Each next slab: y -= 58
    -->

    <!-- ============ SLAB 1: PYTHON (bottom) ============ -->
    <g transform="translate(430,480)">
      <path d="M 0 55 L -110 0 L 0 -55 L 110 0 Z" fill="url(#leftFace)" opacity="0" />
      <!-- Left face -->
      <path d="M -110 0 L 0 55 L 0 99 L -110 44 Z" fill="url(#leftFace)"/>
      <!-- Right face -->
      <path d="M 0 55 L 110 0 L 110 44 L 0 99 Z" fill="url(#rightFace)"/>
      <!-- Top face -->
      <path d="M 0 -55 L 110 0 L 0 55 L -110 0 Z" fill="url(#topPY)" stroke="#0ea5e9" stroke-width="0.5" stroke-opacity="0.4"/>
      <!-- Label on top face -->
      <text x="0" y="6" text-anchor="middle" fill="#0c4a6e" font-family="JetBrains Mono,monospace" font-size="15" font-weight="800" letter-spacing="0.3em">PYTHON</text>
      <!-- Side label -->
      <text x="-55" y="75" fill="#bae6fd" font-family="JetBrains Mono,monospace" font-size="9" letter-spacing="0.2em" opacity="0.7">models/</text>
    </g>

    <!-- ============ SLAB 2: XML ============ -->
    <g transform="translate(430,422)">
      <path d="M -110 0 L 0 55 L 0 99 L -110 44 Z" fill="url(#leftFace)"/>
      <path d="M 0 55 L 110 0 L 110 44 L 0 99 Z" fill="url(#rightFace)"/>
      <path d="M 0 -55 L 110 0 L 0 55 L -110 0 Z" fill="url(#topXML)" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.4"/>
      <text x="0" y="6" text-anchor="middle" fill="#0c4a6e" font-family="JetBrains Mono,monospace" font-size="15" font-weight="800" letter-spacing="0.3em">XML</text>
      <text x="-55" y="75" fill="#bae6fd" font-family="JetBrains Mono,monospace" font-size="9" letter-spacing="0.2em" opacity="0.7">views/</text>
    </g>

    <!-- ============ SLAB 3: OWL ============ -->
    <g transform="translate(430,364)">
      <path d="M -110 0 L 0 55 L 0 99 L -110 44 Z" fill="url(#leftFace)"/>
      <path d="M 0 55 L 110 0 L 110 44 L 0 99 Z" fill="url(#rightFace)"/>
      <path d="M 0 -55 L 110 0 L 0 55 L -110 0 Z" fill="url(#topOWL)" stroke="#7dd3fc" stroke-width="0.5" stroke-opacity="0.4"/>
      <text x="0" y="6" text-anchor="middle" fill="#0c4a6e" font-family="JetBrains Mono,monospace" font-size="15" font-weight="800" letter-spacing="0.3em">OWL</text>
      <text x="-55" y="75" fill="#bae6fd" font-family="JetBrains Mono,monospace" font-size="9" letter-spacing="0.2em" opacity="0.7">static/src/</text>
    </g>

    <!-- ============ SLAB 4: JSON ============ -->
    <g transform="translate(430,306)">
      <path d="M -110 0 L 0 55 L 0 99 L -110 44 Z" fill="url(#leftFace)"/>
      <path d="M 0 55 L 110 0 L 110 44 L 0 99 Z" fill="url(#rightFace)"/>
      <path d="M 0 -55 L 110 0 L 0 55 L -110 0 Z" fill="url(#topJSON)" stroke="#bae6fd" stroke-width="0.5" stroke-opacity="0.4"/>
      <text x="0" y="6" text-anchor="middle" fill="#0c4a6e" font-family="JetBrains Mono,monospace" font-size="15" font-weight="800" letter-spacing="0.3em">JSON</text>
      <text x="-55" y="75" fill="#0c4a6e" font-family="JetBrains Mono,monospace" font-size="9" letter-spacing="0.2em" opacity="0.55">manifest/</text>
    </g>

    <!-- Halo behind top slab -->
    <circle cx="430" cy="236" r="170" fill="url(#testHalo)"/>

    <!-- ============ SLAB 5: TEST (TOP, HIGHLIGHTED, slight lift) ============ -->
    <g transform="translate(430,230)">
      <!-- lift shadow -->
      <ellipse cx="0" cy="104" rx="115" ry="10" fill="rgba(0,0,0,0.25)" filter="url(#blockShadow)"/>
      <!-- Slightly bigger + green gradient -->
      <path d="M -120 0 L 0 60 L 0 108 L -120 48 Z" fill="url(#leftFaceTest)"/>
      <path d="M 0 60 L 120 0 L 120 48 L 0 108 Z" fill="url(#rightFaceTest)"/>
      <path d="M 0 -60 L 120 0 L 0 60 L -120 0 Z" fill="url(#topTEST)" stroke="#4ade80" stroke-width="1" stroke-opacity="0.6"/>
      <!-- Label TEST -->
      <text x="0" y="8" text-anchor="middle" fill="#ecfdf5" font-family="JetBrains Mono,monospace" font-size="18" font-weight="800" letter-spacing="0.35em">TEST</text>
      <!-- Checkmark on face -->
      <g transform="translate(50,-15)">
        <circle r="15" fill="#ecfdf5" stroke="#166534" stroke-width="2"/>
        <path d="M-7,0 L-2,5 L7,-5" stroke="#166534" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Floating verified badge -->
    <g transform="translate(660,160)">
      <g filter="url(#blockShadow)">
        <rect x="-2" y="-2" width="150" height="44" rx="22" fill="rgba(0,0,0,0.3)"/>
      </g>
      <rect x="0" y="0" width="146" height="40" rx="20" fill="#166534" stroke="#4ade80" stroke-width="1.5"/>
      <circle cx="22" cy="20" r="9" fill="#ecfdf5"/>
      <path d="M18,20 L21,23 L27,17" stroke="#166534" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="40" y="24.5" fill="#ecfdf5" font-family="JetBrains Mono,monospace" font-size="12" font-weight="700" letter-spacing="0.22em">VERIFIED</text>
    </g>

    <!-- Connector line from TEST to badge -->
    <path d="M 540 210 Q 595 190, 650 180" stroke="#4ade80" stroke-width="1.5" fill="none" stroke-dasharray="3 3" opacity="0.5"/>

    <!-- Floating code tokens -->
    <g font-family="JetBrains Mono,monospace" font-size="10" fill="#7dd3fc" opacity="0.45">
      <text x="70" y="180">@tagged('post_install')</text>
      <text x="50" y="220">class TestTicket:</text>
    </g>
    <g font-family="JetBrains Mono,monospace" font-size="10" fill="#86efac" opacity="0.6">
      <text x="720" y="340">OK 47/47</text>
      <text x="720" y="360">3.2s</text>
    </g>
  </svg>

  <div class="container">
    <div class="top">
      <div class="logo">
        <div class="logo-mark">O.</div>
        <div class="logo-text">OdooSkills</div>
      </div>
      <div class="badge"><span class="badge-dot"></span>Saison finale</div>
    </div>
    <div class="text-block">
      <div class="eyebrow">Nouvelle série technique</div>
      <h1 class="title">
        DÉPASSEMENT
        <span class="line2">TECH <span class="accent">V19</span></span>
      </h1>
      <p class="subtitle">Tests<span class="sep">·</span>Migration<span class="sep">·</span>OWL<span class="sep">·</span>Bus<span class="sep">·</span>Performance</p>
    </div>
    <div class="bottom">
      <p class="meta">5 articles<span class="sep">·</span>Évergreen<span class="sep">·</span>Odoo 19</p>
      <p class="series-num">T<span>24</span> — T<span>28</span></p>
    </div>
  </div>
</div>
</body>
</html>
