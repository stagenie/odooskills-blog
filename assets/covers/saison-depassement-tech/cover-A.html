<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Cover A — Pipeline CI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Inter:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{--navy:#0c4a6e;--deep:#075985;--sky:#0369a1;--light:#e0f2fe;--green:#166534;--green-l:#22c55e;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:700px;overflow:hidden;font-family:'Inter',sans-serif;background:var(--navy);color:var(--light);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.hero{width:1920px;height:700px;position:relative;background:radial-gradient(ellipse at 70% 50%,rgba(3,105,161,.35) 0%,transparent 55%),linear-gradient(135deg,#0c4a6e 0%,#063a58 100%);overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(224,242,254,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(224,242,254,.035) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;mask-image:radial-gradient(ellipse at center,#000 35%,transparent 85%);-webkit-mask-image:radial-gradient(ellipse at center,#000 35%,transparent 85%)}
.hero::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 3px)}
.container{position:absolute;inset:0;padding:72px 100px;display:flex;flex-direction:column;justify-content:space-between;z-index:5}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.logo{display:inline-flex;align-items:center;gap:14px}
.logo-mark{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#e0f2fe 0%,#bae6fd 100%);color:#0c4a6e;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:26px;display:flex;align-items:center;justify-content:center;letter-spacing:-.06em;box-shadow:0 8px 24px rgba(14,165,233,.2),inset 0 1px 0 rgba(255,255,255,.6)}
.logo-text{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;color:var(--light);letter-spacing:.25em;opacity:.85;text-transform:uppercase}
.badge{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg,#166534 0%,#14532d 100%);color:#fff;font-size:13px;font-weight:600;letter-spacing:.22em;padding:11px 22px;border-radius:999px;text-transform:uppercase;box-shadow:0 6px 18px rgba(22,101,52,.4),inset 0 1px 0 rgba(255,255,255,.15);border:1px solid rgba(134,239,172,.25)}
.badge-dot{width:8px;height:8px;border-radius:50%;background:#86efac;box-shadow:0 0 10px #22c55e,0 0 4px #22c55e}
.text-block{max-width:920px;position:relative;z-index:6}
.eyebrow{display:inline-block;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;color:#7dd3fc;letter-spacing:.35em;margin-bottom:22px;text-transform:uppercase;opacity:.9}
.eyebrow::before{content:'//';color:#0ea5e9;margin-right:14px;opacity:.6}
.title{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:96px;line-height:.92;color:#fff;letter-spacing:-.035em;margin-bottom:28px}
.title .line2{color:var(--light);display:block}
.title .accent{color:#86efac;position:relative}
.subtitle{font-family:'Inter',sans-serif;font-weight:500;font-style:italic;font-size:27px;color:var(--light);opacity:.88;letter-spacing:.005em;line-height:1.3;max-width:720px}
.subtitle .sep{color:#0ea5e9;opacity:.75;margin:0 12px;font-style:normal;font-weight:400}
.bottom{display:flex;justify-content:space-between;align-items:flex-end}
.meta{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.32em;opacity:.7;text-transform:uppercase;color:var(--light)}
.meta .sep{color:#0ea5e9;margin:0 14px;opacity:.65}
.series-num{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--light);opacity:.55;letter-spacing:.2em}
.series-num span{color:#86efac;opacity:.9}
.illo{position:absolute;right:-10px;top:50%;transform:translateY(-50%);width:920px;height:580px;z-index:3;opacity:.95}

/* Subtle noise overlay */
.noise{position:absolute;inset:0;pointer-events:none;opacity:.04;z-index:10;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.55'/></svg>")}
</style>
</head>
<body>
<div class="hero">
  <div class="noise"></div>

  <!-- Illustration: Pipeline CI -->
  <svg class="illo" viewBox="0 0 920 580" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="flowGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#0369a1" stop-opacity="0.15"/>
        <stop offset="40%" stop-color="#0ea5e9" stop-opacity="0.9"/>
        <stop offset="60%" stop-color="#22c55e" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#22c55e" stop-opacity="0.1"/>
      </linearGradient>
      <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0c4a6e"/>
        <stop offset="100%" stop-color="#064467"/>
      </linearGradient>
      <linearGradient id="testNodeGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#15803d"/>
        <stop offset="100%" stop-color="#166534"/>
      </linearGradient>
      <radialGradient id="testGlowGrad" cx=".5" cy=".5" r=".5">
        <stop offset="0%" stop-color="#22c55e" stop-opacity="0.55"/>
        <stop offset="70%" stop-color="#22c55e" stop-opacity="0.05"/>
        <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
      </radialGradient>
      <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
    </defs>

    <!-- Ambient code fragments in background -->
    <g font-family="JetBrains Mono,monospace" font-size="10" fill="#e0f2fe" opacity="0.08">
      <text x="60" y="80">class TestHelpdesk(TransactionCase):</text>
      <text x="80" y="100">    def test_create_ticket(self):</text>
      <text x="100" y="120">        ticket = self.env['helpdesk.ticket'].create(...)</text>
      <text x="600" y="520">@tagged('post_install', '-at_install')</text>
      <text x="620" y="540">def test_controller_http(self):</text>
      <text x="640" y="560">    self.url_open('/helpdesk/ticket/HLP-42')</text>
    </g>

    <!-- Backdrop glow behind TEST node -->
    <circle cx="460" cy="290" r="180" fill="url(#testGlowGrad)"/>

    <!-- Main connecting flow line -->
    <!-- Completed portion (bright) -->
    <path d="M 90 290 Q 180 290, 275 290 T 460 290" stroke="url(#flowGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Pending portion (dashed, dim) -->
    <path d="M 460 290 Q 560 290, 645 290 T 830 290" stroke="#075985" stroke-width="2" fill="none" stroke-dasharray="6 8" stroke-linecap="round" opacity="0.5"/>

    <!-- Particles along completed flow -->
    <circle cx="200" cy="290" r="2.5" fill="#7dd3fc" opacity="0.9"/>
    <circle cx="320" cy="290" r="2" fill="#7dd3fc" opacity="0.6"/>
    <circle cx="400" cy="290" r="3" fill="#86efac" opacity="0.95"/>

    <!-- Node 1: CODE -->
    <g transform="translate(90,290)">
      <circle r="44" fill="url(#nodeGrad)" stroke="#0369a1" stroke-width="1.5"/>
      <circle r="44" fill="none" stroke="#7dd3fc" stroke-width="1" opacity="0.25"/>
      <g transform="translate(0,-2)" stroke="#bae6fd" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M-14,-7 L-20,0 L-14,7"/>
        <path d="M14,-7 L20,0 L14,7"/>
        <path d="M-5,9 L5,-9" opacity="0.8"/>
      </g>
      <text y="70" text-anchor="middle" fill="#e0f2fe" font-family="JetBrains Mono,monospace" font-size="11" font-weight="700" letter-spacing="0.3em">CODE</text>
    </g>

    <!-- Node 2: BUILD -->
    <g transform="translate(275,290)">
      <circle r="44" fill="url(#nodeGrad)" stroke="#0369a1" stroke-width="1.5"/>
      <circle r="44" fill="none" stroke="#7dd3fc" stroke-width="1" opacity="0.25"/>
      <g stroke="#bae6fd" stroke-width="2" stroke-linecap="round" fill="none">
        <circle r="7" stroke-width="2"/>
        <path d="M0,-14 L0,-18 M0,14 L0,18 M-14,0 L-18,0 M14,0 L18,0"/>
        <path d="M-10,-10 L-13,-13 M10,-10 L13,-13 M-10,10 L-13,13 M10,10 L13,13" opacity="0.75"/>
      </g>
      <text y="70" text-anchor="middle" fill="#e0f2fe" font-family="JetBrains Mono,monospace" font-size="11" font-weight="700" letter-spacing="0.3em">BUILD</text>
    </g>

    <!-- Node 3: TEST (HIGHLIGHTED) -->
    <g transform="translate(460,290)">
      <!-- outer glow ring -->
      <circle r="68" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.35"/>
      <circle r="58" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.6"/>
      <!-- main body -->
      <circle r="52" fill="url(#testNodeGrad)" stroke="#4ade80" stroke-width="2"/>
      <circle r="52" fill="none" stroke="#86efac" stroke-width="0.8" opacity="0.5"/>
      <!-- checkmark -->
      <path d="M-18,-2 L-6,12 L18,-14" stroke="#ecfdf5" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="80" text-anchor="middle" fill="#86efac" font-family="JetBrains Mono,monospace" font-size="13" font-weight="800" letter-spacing="0.35em">TEST</text>
      <text y="96" text-anchor="middle" fill="#4ade80" font-family="JetBrains Mono,monospace" font-size="9" letter-spacing="0.2em" opacity="0.85">47 passed</text>
    </g>

    <!-- Node 4: REVIEW (pending) -->
    <g transform="translate(645,290)" opacity="0.55">
      <circle r="40" fill="url(#nodeGrad)" stroke="#075985" stroke-width="1.5"/>
      <g stroke="#7dd3fc" stroke-width="2" fill="none" stroke-linecap="round">
        <path d="M-18,0 C-12,-10 12,-10 18,0 C12,10 -12,10 -18,0 Z"/>
        <circle r="4.5"/>
      </g>
      <text y="68" text-anchor="middle" fill="#7dd3fc" font-family="JetBrains Mono,monospace" font-size="11" font-weight="700" letter-spacing="0.3em">REVIEW</text>
    </g>

    <!-- Node 5: DEPLOY (pending) -->
    <g transform="translate(830,290)" opacity="0.4">
      <circle r="40" fill="url(#nodeGrad)" stroke="#075985" stroke-width="1.5"/>
      <g stroke="#7dd3fc" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-10,12 L10,-12"/>
        <path d="M2,-12 L12,-12 L12,-2"/>
        <circle cx="-6" cy="8" r="2" fill="#7dd3fc"/>
      </g>
      <text y="68" text-anchor="middle" fill="#7dd3fc" font-family="JetBrains Mono,monospace" font-size="11" font-weight="700" letter-spacing="0.3em">DEPLOY</text>
    </g>

    <!-- Small telemetry labels -->
    <g font-family="JetBrains Mono,monospace" font-size="10" fill="#7dd3fc" opacity="0.6">
      <text x="80" y="380" letter-spacing="0.15em">→ commit 7f3a2b1</text>
      <text x="260" y="380" letter-spacing="0.15em">→ 18.4s</text>
      <text x="440" y="380" letter-spacing="0.15em" fill="#86efac" opacity="0.9">→ OK 3.2s</text>
    </g>

    <!-- decorative vertical scale marks (right side) -->
    <g stroke="#0ea5e9" stroke-width="1" opacity="0.25">
      <line x1="880" y1="120" x2="900" y2="120"/>
      <line x1="880" y1="180" x2="900" y2="180"/>
      <line x1="880" y1="240" x2="895" y2="240"/>
      <line x1="880" y1="460" x2="895" y2="460"/>
      <line x1="880" y1="520" x2="900" y2="520"/>
    </g>
  </svg>

  <div class="container">
    <div class="top">
      <div class="logo">
        <div class="logo-mark">O.</div>
        <div class="logo-text">OdooSkills</div>
      </div>
      <div class="badge"><span class="badge-dot"></span>Saison finale</div>
    </div>
    <div class="text-block">
      <div class="eyebrow">Nouvelle série technique</div>
      <h1 class="title">
        DÉPASSEMENT
        <span class="line2">TECH <span class="accent">V19</span></span>
      </h1>
      <p class="subtitle">Tests<span class="sep">·</span>Migration<span class="sep">·</span>OWL<span class="sep">·</span>Bus<span class="sep">·</span>Performance</p>
    </div>
    <div class="bottom">
      <p class="meta">5 articles<span class="sep">·</span>Évergreen<span class="sep">·</span>Odoo 19</p>
      <p class="series-num">T<span>24</span> — T<span>28</span></p>
    </div>
  </div>
</div>
</body>
</html>
