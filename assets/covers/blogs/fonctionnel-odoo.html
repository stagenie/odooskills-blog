<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Fonctionnel Odoo — OdooSkills</title>
<style>
  :root {
    --font: "Helvetica Neue", Inter, Arial, "Liberation Sans", sans-serif;
    --ink: #ffffff;
    --muted: rgba(255, 255, 255, 0.82);
    --faint: rgba(255, 255, 255, 0.55);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #000; }
  body { font-family: var(--font); }

  .cover {
    position: relative;
    width: 1920px;
    height: 700px;
    overflow: hidden;
    color: var(--ink);
    background:
      radial-gradient(900px 620px at 4% 0%, rgba(168, 116, 148, 0.55) 0%, rgba(168, 116, 148, 0) 62%),
      radial-gradient(760px 520px at 2% 100%, rgba(120, 78, 122, 0.45) 0%, rgba(120, 78, 122, 0) 60%),
      radial-gradient(1100px 700px at 88% 46%, rgba(70, 34, 92, 0.55) 0%, rgba(70, 34, 92, 0) 70%),
      linear-gradient(118deg, #3a2340 0%, #2b1a38 38%, #241333 72%, #281738 100%);
  }

  /* trame quadrillée très discrète */
  .grid {
    position: absolute; inset: 0; z-index: 1; opacity: 0.5;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 78px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 78px);
    mask-image: radial-gradient(1200px 620px at 46% 40%, #000 0%, transparent 78%);
  }

  .halo {
    position: absolute; z-index: 2;
    left: 1055px; top: 100px; width: 182px; height: 182px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.028);
    border: 1px solid rgba(255, 255, 255, 0.045);
  }

  .stage { position: absolute; inset: 0; z-index: 3; }

  /* ── colonne de gauche ─────────────────────────────────────── */
  .text {
    position: absolute;
    left: 130px; top: 0; bottom: 0; width: 900px;
    display: flex; flex-direction: column; justify-content: center;
    padding-bottom: 8px;
  }

  .pill {
    align-self: flex-start;
    padding: 13px 27px;
    border: 1px solid rgba(255, 255, 255, 0.30);
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.20em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.90);
    background: rgba(255, 255, 255, 0.045);
  }

  .title {
    margin: 30px 0 0;
    font-size: 88px;
    font-weight: 800;
    line-height: 1.04;
    letter-spacing: -0.022em;
  }
  .title .accent {
    background: linear-gradient(96deg, #f3b9d2 0%, #e2a2c0 46%, #c489a8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .tagline {
    margin: 30px 0 0;
    max-width: 790px;
    font-size: 27px;
    line-height: 1.52;
    color: var(--muted);
  }

  .foot {
    /* Le conteneur du blog rogne a 380 px de haut : cette bande tombe hors
       champ (ou coupee en deux selon la largeur). Neutralisee. */
    display: none !important;
    position: absolute;
    left: 130px; bottom: 62px;
    display: flex; align-items: center; gap: 22px;
    font-size: 15px; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--faint);
  }
  .foot .rule {
    width: 62px; height: 2px;
    background: linear-gradient(90deg, rgba(243,185,210,0.85), rgba(243,185,210,0.15));
  }

  /* ── grille d'icônes à droite ──────────────────────────────── */
  .apps {
    position: absolute;
    right: 130px; top: 50%; transform: translateY(-50%);
    display: grid;
    grid-template-columns: repeat(3, 108px);
    grid-auto-rows: 108px;
    gap: 28px;
  }
  .app {
    display: flex; align-items: center; justify-content: center;
    border-radius: 20px;
    font-size: 46px; line-height: 1;
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(255, 255, 255, 0.085);
  }
  .app.hi {
    background: linear-gradient(150deg, rgba(243,185,210,0.55), rgba(205,140,175,0.32));
    border-color: rgba(255, 255, 255, 0.34);
    box-shadow: 0 0 46px rgba(243, 185, 210, 0.28);
  }
</style>
</head>
<body>
  <div class="cover" role="img" aria-label="Fonctionnel Odoo — bannière du blog OdooSkills">
    <div class="grid"></div>
    <div class="halo"></div>

    <div class="stage">
      <section class="text">
        <span class="pill">Série fonctionnelle</span>
        <h1 class="title">
          Fonctionnel<br />
          <span class="accent">Odoo</span>
        </h1>
        <p class="tagline">
          Tutoriels et guides pas à pas pour maîtriser la configuration
          métier &mdash; inventaire, ventes, comptabilité, fabrication, CRM.
        </p>
      </section>

      <div class="foot">
        <span class="rule"></span>
        <span>Pas à pas &middot; testé sur une instance réelle</span>
      </div>

      <section class="apps">
        <div class="app">📊</div>
        <div class="app">💼</div>
        <div class="app">🧾</div>
        <div class="app">⚙️</div>
        <div class="app hi">✨</div>
        <div class="app">📈</div>
        <div class="app">🎯</div>
        <div class="app">🏭</div>
        <div class="app">🛒</div>
      </section>
    </div>
  </div>
</body>
</html>
