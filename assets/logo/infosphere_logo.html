<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:transparent;}
  #logo{display:flex;align-items:center;gap:14px;padding:24px 32px;width:fit-content;
    font-family:'Segoe UI', system-ui, sans-serif;}
  .globe{width:64px;height:64px;}
  .text{display:flex;flex-direction:column;line-height:1;}
  .name{font-size:38px;font-weight:700;color:#0c4a6e;letter-spacing:-0.5px;}
  .name .sphere{color:#0369a1;}
  .tagline{font-size:11px;font-weight:500;color:#64748b;margin-top:6px;letter-spacing:1.5px;text-transform:uppercase;}
</style></head><body>
<div id="logo">
  <svg class="globe" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="g" cx="35%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#38bdf8"/>
        <stop offset="60%" stop-color="#0369a1"/>
        <stop offset="100%" stop-color="#0c4a6e"/>
      </radialGradient>
    </defs>
    <circle cx="32" cy="32" r="28" fill="url(#g)"/>
    <ellipse cx="32" cy="32" rx="28" ry="10" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.75"/>
    <ellipse cx="32" cy="32" rx="14" ry="28" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.6"/>
    <ellipse cx="32" cy="32" rx="28" ry="20" fill="none" stroke="#e0f2fe" stroke-width="1.2" opacity="0.5"/>
    <line x1="4" y1="32" x2="60" y2="32" stroke="#e0f2fe" stroke-width="1.5" opacity="0.75"/>
  </svg>
  <div class="text">
    <div class="name">Info<span class="sphere">Sphere</span></div>
    <div class="tagline">ERP · IT · Mobilier · Alger</div>
  </div>
</div>
</body></html>
