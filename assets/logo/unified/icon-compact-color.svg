<?xml version="1.0" encoding="UTF-8"?>
<!-- Marque mère OdooSkills × AISkillsPro — anneau entaillé + aiguille + cible -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="32.60 10.40 193.60 193.60"
     role="img" aria-label="Logo du groupe OdooSkills et AISkillsPro">
  <defs>
    <linearGradient id="needleNorth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD25A"/>
      <stop offset="100%" stop-color="#F9C846"/>
    </linearGradient>
  </defs>
  <g transform="translate(128.0 128.0) rotate(30.0)">
    <!-- Anneau OdooSkills, intact sauf l'encoche par laquelle l'aiguille sort -->
    <path d="M 15.000 -68.374 A 70.000 70.000 0 1 1 -15.000 -68.374 L -15.000 -24.714 A 28.910 28.910 0 1 0 15.000 -24.714 Z" fill="#017E84"/>

    <!-- Aiguille AISkillsPro : contrepoids dans le vide, pointe hors de l'anneau -->
    <polygon points="-9.5,0 9.5,0 0,24.0" fill="#101F38" opacity="1"/>
    <polygon points="-9.5,0 9.5,0 0,-92.0" fill="url(#needleNorth)"/>
  </g>

  <!-- Pivot -->
  <circle cx="128.0" cy="128.0" r="9.5" fill="#F8F9FA"/>
  <circle cx="128.0" cy="128.0" r="4.2" fill="#101F38"/>

  <!-- Cible : le losange visé, jamais touché -->
  <g transform="translate(181.000 36.201) rotate(45)">
    <rect x="-14.0" y="-14.0" width="28.0" height="28.0" fill="url(#needleNorth)"/>
  </g>
</svg>
