<?xml version="1.0" encoding="UTF-8"?>
<!-- Marque mère OdooSkills × AISkillsPro — anneau entaillé + aiguille + cible -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="52.00 11.18 152.56 192.82"
     role="img" aria-label="Logo du groupe OdooSkills et AISkillsPro">
  <defs>
    <linearGradient id="needleNorth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD25A"/>
      <stop offset="100%" stop-color="#F9C846"/>
    </linearGradient>
  </defs>
  <g transform="translate(128.0 128.0) rotate(30.0)">
    <!-- Anneau OdooSkills, intact sauf l'encoche par laquelle l'aiguille sort -->
    <path d="M 11.000 -69.130 A 70.000 70.000 0 1 1 -11.000 -69.130 L -11.000 -26.736 A 28.910 28.910 0 1 0 11.000 -26.736 Z" fill="#017E84"/>

    <!-- Aiguille AISkillsPro : contrepoids dans le vide, pointe hors de l'anneau -->
    <polygon points="-6.0,0 6.0,0 0,26.0" fill="#8FA3B8" opacity="1"/>
    <polygon points="-6.0,0 6.0,0 0,-90.0" fill="url(#needleNorth)"/>
  </g>

  <!-- Pivot -->
  <circle cx="128.0" cy="128.0" r="8.5" fill="#F8F9FA"/>
  <circle cx="128.0" cy="128.0" r="3.8" fill="#101F38"/>

  <!-- Cible : le losange visé, jamais touché -->
  <g transform="translate(183.000 32.737) rotate(45)">
    <rect x="-11.0" y="-11.0" width="22.0" height="22.0" fill="url(#needleNorth)"/>
  </g>
</svg>
