<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <!-- Title -->
  <text x="450" y="22" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Pipeline CRM dans Odoo 19</text>

  <!-- Funnel stages -->
  <!-- New -->
  <rect x="30" y="50" width="160" height="55" rx="8" fill="#6c757d" stroke="#5a6268" stroke-width="2"/>
  <text x="110" y="73" text-anchor="middle" fill="white" font-weight="bold">Nouveau</text>
  <text x="110" y="91" text-anchor="middle" fill="#ddd" font-size="11">Lead ou opportunité</text>

  <line x1="190" y1="78" x2="225" y2="78" stroke="#714B67" stroke-width="2.5" marker-end="url(#arrC)"/>

  <!-- Qualified -->
  <rect x="225" y="50" width="160" height="55" rx="8" fill="#0d6efd" stroke="#0b5ed7" stroke-width="2"/>
  <text x="305" y="73" text-anchor="middle" fill="white" font-weight="bold">Qualifié</text>
  <text x="305" y="91" text-anchor="middle" fill="#cfe2ff" font-size="11">Besoin confirmé</text>

  <line x1="385" y1="78" x2="420" y2="78" stroke="#714B67" stroke-width="2.5" marker-end="url(#arrC)"/>

  <!-- Proposition -->
  <rect x="420" y="50" width="160" height="55" rx="8" fill="#fd7e14" stroke="#e8690a" stroke-width="2"/>
  <text x="500" y="73" text-anchor="middle" fill="white" font-weight="bold">Proposition</text>
  <text x="500" y="91" text-anchor="middle" fill="#ffe5d0" font-size="11">Devis envoyé</text>

  <line x1="580" y1="78" x2="615" y2="78" stroke="#714B67" stroke-width="2.5" marker-end="url(#arrC)"/>

  <!-- Won -->
  <rect x="615" y="50" width="160" height="55" rx="8" fill="#198754" stroke="#157347" stroke-width="2"/>
  <text x="695" y="73" text-anchor="middle" fill="white" font-weight="bold">Gagné</text>
  <text x="695" y="91" text-anchor="middle" fill="#d1e7dd" font-size="11">Commande signée</text>

  <!-- Revenue indicators -->
  <text x="110" y="130" text-anchor="middle" font-size="11" fill="#6c757d">1 200 000 DA</text>
  <text x="305" y="130" text-anchor="middle" font-size="11" fill="#0d6efd">850 000 DA</text>
  <text x="500" y="130" text-anchor="middle" font-size="11" fill="#fd7e14">3 100 000 DA</text>
  <text x="695" y="130" text-anchor="middle" font-size="11" fill="#198754">380 000 DA</text>

  <!-- Legend -->
  <text x="450" y="160" text-anchor="middle" font-size="11" fill="#999">Chaque étape rapproche le prospect de la commande — le chiffre d'affaires attendu s'affine au fil du pipeline</text>

  <defs>
    <marker id="arrC" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#714B67"/>
    </marker>
  </defs>
</svg>
