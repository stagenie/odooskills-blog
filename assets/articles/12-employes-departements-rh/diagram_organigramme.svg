<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="900" height="520" rx="14" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">Organigramme InfoSphere</text>

  <!-- ============================================================ -->
  <!-- DIRECTION GENERALE — row 0 (y=60) -->
  <!-- ============================================================ -->
  <rect x="310" y="58" width="280" height="62" rx="10" fill="#1B3A5C" filter="url(#shadow)"/>
  <text x="450" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">Mustapha Benhamida</text>
  <text x="450" y="104" text-anchor="middle" font-size="12" fill="#a8c8e8">Directeur General</text>

  <!-- Vertical line from DG down to horizontal bus -->
  <line x1="450" y1="120" x2="450" y2="200" stroke="#1B3A5C" stroke-width="2"/>

  <!-- ============================================================ -->
  <!-- ASSISTANTE — branch off DG connector (y=155) -->
  <!-- ============================================================ -->
  <!-- Horizontal stub from main line to assistant box -->
  <line x1="450" y1="155" x2="580" y2="155" stroke="#1B3A5C" stroke-width="1.5" stroke-dasharray="5,3"/>
  <rect x="580" y="130" width="230" height="50" rx="8" fill="#E8EFF5" stroke="#1B3A5C" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="695" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#1B3A5C">Samira Rahmouni</text>
  <text x="695" y="168" text-anchor="middle" font-size="11" fill="#555">Assistante Administrative</text>

  <!-- ============================================================ -->
  <!-- HORIZONTAL BUS at y=200 -->
  <!-- ============================================================ -->
  <line x1="225" y1="200" x2="675" y2="200" stroke="#1B3A5C" stroke-width="2"/>

  <!-- Left vertical drop to IT dept head -->
  <line x1="225" y1="200" x2="225" y2="230" stroke="#1B3A5C" stroke-width="2"/>
  <!-- Right vertical drop to Commercial dept head -->
  <line x1="675" y1="200" x2="675" y2="230" stroke="#1B3A5C" stroke-width="2"/>

  <!-- ============================================================ -->
  <!-- DEPARTEMENT IT & RESEAUX -->
  <!-- ============================================================ -->

  <!-- Department label -->
  <rect x="60" y="230" width="330" height="32" rx="6" fill="#0E7C86" opacity="0.12"/>
  <text x="225" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#0E7C86">Departement IT &amp; Reseaux</text>

  <!-- Head: Karim Mehdaoui -->
  <rect x="100" y="272" width="250" height="58" rx="10" fill="#0E7C86" filter="url(#shadow)"/>
  <text x="225" y="297" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Karim Mehdaoui</text>
  <text x="225" y="315" text-anchor="middle" font-size="11" fill="#b2e0e3">Responsable IT</text>

  <!-- Vertical line from IT head to team bus -->
  <line x1="225" y1="330" x2="225" y2="365" stroke="#0E7C86" stroke-width="1.5"/>

  <!-- Horizontal bus for IT team -->
  <line x1="90" y1="365" x2="360" y2="365" stroke="#0E7C86" stroke-width="1.5"/>

  <!-- Drops to 3 team members -->
  <line x1="90" y1="365" x2="90" y2="385" stroke="#0E7C86" stroke-width="1.5"/>
  <line x1="225" y1="365" x2="225" y2="385" stroke="#0E7C86" stroke-width="1.5"/>
  <line x1="360" y1="365" x2="360" y2="385" stroke="#0E7C86" stroke-width="1.5"/>

  <!-- Yacine Khediri -->
  <rect x="18" y="385" width="144" height="58" rx="8" fill="#E0F4F4" stroke="#0E7C86" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="90" y="409" text-anchor="middle" font-size="12" font-weight="bold" fill="#0E7C86">Yacine Khediri</text>
  <text x="90" y="425" text-anchor="middle" font-size="10.5" fill="#555">Developpeur</text>

  <!-- Nadia Tlemcani -->
  <rect x="153" y="385" width="144" height="58" rx="8" fill="#E0F4F4" stroke="#0E7C86" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="225" y="409" text-anchor="middle" font-size="12" font-weight="bold" fill="#0E7C86">Nadia Tlemcani</text>
  <text x="225" y="425" text-anchor="middle" font-size="10.5" fill="#555">Technicien Reseaux</text>

  <!-- Farid Boudiaf -->
  <rect x="288" y="385" width="144" height="58" rx="8" fill="#E0F4F4" stroke="#0E7C86" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="360" y="409" text-anchor="middle" font-size="12" font-weight="bold" fill="#0E7C86">Farid Boudiaf</text>
  <text x="360" y="425" text-anchor="middle" font-size="10.5" fill="#555">Technicien Support</text>

  <!-- ============================================================ -->
  <!-- DEPARTEMENT COMMERCIAL -->
  <!-- ============================================================ -->

  <!-- Department label -->
  <rect x="530" y="230" width="290" height="32" rx="6" fill="#2E5AAC" opacity="0.12"/>
  <text x="675" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E5AAC">Departement Commercial</text>

  <!-- Head: Amina Bouzidi -->
  <rect x="550" y="272" width="250" height="58" rx="10" fill="#2E5AAC" filter="url(#shadow)"/>
  <text x="675" y="297" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Amina Bouzidi</text>
  <text x="675" y="315" text-anchor="middle" font-size="11" fill="#b3c8ee">Responsable Commercial</text>

  <!-- Vertical line from Commercial head to team member -->
  <line x1="675" y1="330" x2="675" y2="385" stroke="#2E5AAC" stroke-width="1.5"/>

  <!-- Omar Saidi -->
  <rect x="603" y="385" width="144" height="58" rx="8" fill="#E3EAF7" stroke="#2E5AAC" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="675" y="409" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E5AAC">Omar Saidi</text>
  <text x="675" y="425" text-anchor="middle" font-size="10.5" fill="#555">Commercial</text>

  <!-- ============================================================ -->
  <!-- LEGEND -->
  <!-- ============================================================ -->
  <rect x="28" y="468" width="844" height="38" rx="8" fill="#fff" opacity="0.7"/>
  <circle cx="60" cy="487" r="7" fill="#1B3A5C"/>
  <text x="75" y="492" font-size="11" fill="#555">Direction Generale</text>
  <circle cx="230" cy="487" r="7" fill="#0E7C86"/>
  <text x="245" y="492" font-size="11" fill="#555">IT &amp; Reseaux</text>
  <circle cx="370" cy="487" r="7" fill="#2E5AAC"/>
  <text x="385" y="492" font-size="11" fill="#555">Commercial</text>
  <line x1="500" y1="487" x2="530" y2="487" stroke="#1B3A5C" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="540" y="492" font-size="11" fill="#555">Rattachement fonctionnel</text>
  <text x="758" y="492" font-size="10" fill="#aaa">8 employes | InfoSphere SARL</text>
</svg>