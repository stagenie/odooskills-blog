<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <!-- Title -->
  <text x="450" y="22" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Architecture comptable Odoo 19 — Algérie</text>

  <!-- Plan comptable -->
  <rect x="330" y="40" width="240" height="45" rx="8" fill="#714B67" stroke="#5a3a52" stroke-width="2"/>
  <text x="450" y="60" text-anchor="middle" fill="white" font-weight="bold">Plan comptable (l10n_dz)</text>
  <text x="450" y="76" text-anchor="middle" fill="#ddd" font-size="11">299 comptes — SCF algérien</text>

  <!-- Arrows down -->
  <line x1="250" y1="85" x2="250" y2="110" stroke="#714B67" stroke-width="2" marker-end="url(#arrAc)"/>
  <line x1="450" y1="85" x2="450" y2="110" stroke="#714B67" stroke-width="2" marker-end="url(#arrAc)"/>
  <line x1="650" y1="85" x2="650" y2="110" stroke="#714B67" stroke-width="2" marker-end="url(#arrAc)"/>

  <!-- Row: 3 pillars -->
  <!-- Journaux -->
  <rect x="130" y="110" width="240" height="50" rx="8" fill="#0d6efd" stroke="#0b5ed7" stroke-width="2"/>
  <text x="250" y="133" text-anchor="middle" fill="white" font-weight="bold">Journaux</text>
  <text x="250" y="150" text-anchor="middle" fill="#cfe2ff" font-size="11">Ventes · Achats · Banque · Caisse</text>

  <!-- Taxes -->
  <rect x="390" y="110" width="120" height="50" rx="8" fill="#fd7e14" stroke="#e8690a" stroke-width="2"/>
  <text x="450" y="133" text-anchor="middle" fill="white" font-weight="bold">Taxes</text>
  <text x="450" y="150" text-anchor="middle" fill="#ffe5d0" font-size="11">TVA 19% · 9% · 0%</text>

  <!-- Positions fiscales -->
  <rect x="530" y="110" width="240" height="50" rx="8" fill="#198754" stroke="#157347" stroke-width="2"/>
  <text x="650" y="133" text-anchor="middle" fill="white" font-weight="bold">Positions fiscales</text>
  <text x="650" y="150" text-anchor="middle" fill="#d1e7dd" font-size="11">National · Export · Exonéré</text>

  <!-- Arrow down to operations -->
  <line x1="450" y1="160" x2="450" y2="190" stroke="#714B67" stroke-width="2" marker-end="url(#arrAc)"/>

  <!-- Operations row -->
  <rect x="180" y="190" width="540" height="40" rx="8" fill="#e8d5e0" stroke="#714B67" stroke-width="1.5"/>
  <text x="450" y="215" text-anchor="middle" fill="#714B67" font-weight="bold">Factures clients · Factures fournisseurs · Paiements · Lettrage</text>

  <defs>
    <marker id="arrAc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#714B67"/>
    </marker>
  </defs>
</svg>
