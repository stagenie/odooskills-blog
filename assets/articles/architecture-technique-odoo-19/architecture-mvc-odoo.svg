<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="modelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#336791;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#264f73;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="viewGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#388E3C;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="controllerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#714B67;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#5a3a52;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="ormGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#E65100;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="browserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1565C0;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/></filter>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#999"/></marker>
    <marker id="arrowL" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto"><polygon points="8 0,0 3,8 6" fill="#999"/></marker>
    <marker id="arrowD" markerWidth="6" markerHeight="8" refX="3" refY="8" orient="auto"><polygon points="0 0,3 8,6 0" fill="#999"/></marker>
    <marker id="arrowU" markerWidth="6" markerHeight="8" refX="3" refY="0" orient="auto"><polygon points="0 8,3 0,6 8" fill="#999"/></marker>
  </defs>

  <!-- Title -->
  <text x="430" y="30" text-anchor="middle" fill="#333" font-size="18" font-weight="bold">Architecture MVC adaptée d'Odoo 19</text>

  <!-- Browser -->
  <rect x="300" y="50" width="260" height="70" rx="12" fill="url(#browserGrad)" filter="url(#shadow)"/>
  <text x="430" y="80" text-anchor="middle" fill="white" font-size="16" font-weight="bold">Navigateur</text>
  <text x="430" y="100" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="11">OWL Components + QWeb Templates</text>

  <!-- Arrow Browser -> Controller -->
  <line x1="430" y1="120" x2="430" y2="155" stroke="#999" stroke-width="2" marker-end="url(#arrowD)"/>
  <text x="450" y="142" fill="#666" font-size="10">HTTP / JSON-RPC</text>

  <!-- Controller -->
  <rect x="250" y="160" width="360" height="90" rx="12" fill="url(#controllerGrad)" filter="url(#shadow)"/>
  <text x="430" y="192" text-anchor="middle" fill="white" font-size="16" font-weight="bold">Controller (C)</text>
  <text x="430" y="212" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="12">Routage HTTP + Actions + Sécurité</text>
  <text x="430" y="232" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-size="11">odoo/http.py + ir.actions.act_window</text>

  <!-- Arrow Controller -> ORM -->
  <line x1="430" y1="250" x2="430" y2="285" stroke="#999" stroke-width="2" marker-end="url(#arrowD)"/>

  <!-- ORM Layer -->
  <rect x="250" y="290" width="360" height="60" rx="10" fill="url(#ormGrad)" filter="url(#shadow)"/>
  <text x="430" y="318" text-anchor="middle" fill="white" font-size="14" font-weight="bold">ORM (Object-Relational Mapping)</text>
  <text x="430" y="338" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="11">create() / read() / write() / unlink() / search()</text>

  <!-- Model (left) -->
  <rect x="30" y="170" width="180" height="195" rx="12" fill="url(#modelGrad)" filter="url(#shadow)"/>
  <text x="120" y="200" text-anchor="middle" fill="white" font-size="16" font-weight="bold">Model (M)</text>
  <line x1="50" y1="212" x2="190" y2="212" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="120" y="234" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="12">Modèles Python</text>
  <text x="120" y="254" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11">Champs (fields.*)</text>
  <text x="120" y="274" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11">Méthodes métier</text>
  <text x="120" y="294" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11">Contraintes</text>
  <rect x="45" y="310" width="150" height="36" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="120" y="324" text-anchor="middle" fill="white" font-size="10">models/</text>
  <text x="120" y="340" text-anchor="middle" fill="white" font-size="10">sale_order.py</text>

  <!-- View (right) -->
  <rect x="650" y="170" width="180" height="195" rx="12" fill="url(#viewGrad)" filter="url(#shadow)"/>
  <text x="740" y="200" text-anchor="middle" fill="white" font-size="16" font-weight="bold">View (V)</text>
  <line x1="670" y1="212" x2="810" y2="212" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="740" y="234" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="12">Vues XML</text>
  <text x="740" y="254" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11">Form / List / Kanban</text>
  <text x="740" y="274" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11">Search / Pivot / Graph</text>
  <text x="740" y="294" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11">QWeb Templates</text>
  <rect x="665" y="310" width="150" height="36" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="740" y="324" text-anchor="middle" fill="white" font-size="10">views/</text>
  <text x="740" y="340" text-anchor="middle" fill="white" font-size="10">sale_order_views.xml</text>

  <!-- Arrows Controller <-> Model -->
  <line x1="250" y1="200" x2="210" y2="230" stroke="#999" stroke-width="1.5" marker-end="url(#arrowL)"/>
  <line x1="210" y1="260" x2="250" y2="230" stroke="#999" stroke-width="1.5" marker-end="url(#arrowR)"/>

  <!-- Arrows Controller <-> View -->
  <line x1="610" y1="200" x2="650" y2="230" stroke="#999" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <line x1="650" y1="260" x2="610" y2="230" stroke="#999" stroke-width="1.5" marker-end="url(#arrowL)"/>

  <!-- PostgreSQL -->
  <rect x="300" y="380" width="260" height="65" rx="12" fill="#264f73" filter="url(#shadow)"/>
  <text x="430" y="408" text-anchor="middle" fill="white" font-size="15" font-weight="bold">PostgreSQL</text>
  <text x="430" y="428" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11">Tables = Modèles | Colonnes = Champs</text>

  <!-- Arrow ORM <-> PostgreSQL -->
  <line x1="430" y1="350" x2="430" y2="380" stroke="#999" stroke-width="2" marker-end="url(#arrowD)"/>
  <text x="460" y="370" fill="#666" font-size="10">SQL</text>
</svg>