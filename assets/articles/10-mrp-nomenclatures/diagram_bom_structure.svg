<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 550" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#714B67"/>
    </marker>
  </defs>

  <rect width="1800" height="550" rx="14" fill="url(#bg)"/>

  <!-- Title -->
  <text x="900" y="45" text-anchor="middle" font-size="26" font-weight="bold" fill="#333">Nomenclatures InfoSphere — Structure des composants</text>

  <!-- ===== PACK PC (left) ===== -->
  <rect x="60" y="80" width="340" height="90" rx="12" fill="#714B67" filter="url(#shadow)"/>
  <text x="230" y="115" text-anchor="middle" font-size="20" font-weight="bold" fill="white">Pack PC Bureautique</text>
  <text x="230" y="142" text-anchor="middle" font-size="14" fill="#f0e0ec">PACK-PC-001 | Vente : 245 000 DA</text>

  <!-- Lines from Pack PC to components -->
  <line x1="230" y1="170" x2="100" y2="210" stroke="#714B67" stroke-width="2"/>
  <line x1="230" y1="170" x2="230" y2="210" stroke="#714B67" stroke-width="2"/>
  <line x1="230" y1="170" x2="360" y2="210" stroke="#714B67" stroke-width="2"/>
  <line x1="230" y1="170" x2="490" y2="210" stroke="#714B67" stroke-width="2"/>

  <!-- Component 1: Laptop -->
  <rect x="20" y="210" width="160" height="100" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="100" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">Dell Latitude 5450</text>
  <text x="100" y="258" text-anchor="middle" font-size="12" fill="#333">LAPTOP-001</text>
  <text x="100" y="278" text-anchor="middle" font-size="13" fill="#333">Qté : 1</text>
  <text x="100" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">120 000 DA</text>

  <!-- Component 2: SSD -->
  <rect x="200" y="210" width="160" height="100" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="280" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">Samsung 870 EVO</text>
  <text x="280" y="258" text-anchor="middle" font-size="12" fill="#333">SSD-001</text>
  <text x="280" y="278" text-anchor="middle" font-size="13" fill="#333">Qté : 1</text>
  <text x="280" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">9 500 DA</text>

  <!-- Component 3: UPS -->
  <rect x="380" y="210" width="160" height="100" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="460" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">APC Smart-UPS</text>
  <text x="460" y="258" text-anchor="middle" font-size="12" fill="#333">UPS-001</text>
  <text x="460" y="278" text-anchor="middle" font-size="13" fill="#333">Qté : 1</text>
  <text x="460" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">45 000 DA</text>

  <!-- Component 4: Cables (under the UPS) -->
  <rect x="200" y="340" width="160" height="100" rx="8" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="280" y="367" text-anchor="middle" font-size="13" font-weight="bold" fill="#7b1fa2">Câble Cat6 UTP</text>
  <text x="280" y="388" text-anchor="middle" font-size="12" fill="#333">CABLE-001</text>
  <text x="280" y="408" text-anchor="middle" font-size="13" fill="#333">Qté : 5 m</text>
  <text x="280" y="428" text-anchor="middle" font-size="12" font-weight="bold" fill="#7b1fa2">225 DA</text>

  <line x1="490" y1="260" x2="360" y2="340" stroke="#714B67" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Total cost Pack PC -->
  <rect x="60" y="470" width="340" height="55" rx="8" fill="#f8f0f6" stroke="#714B67" stroke-width="1.5"/>
  <text x="230" y="495" text-anchor="middle" font-size="15" fill="#333">Coût total composants :</text>
  <text x="230" y="515" text-anchor="middle" font-size="18" font-weight="bold" fill="#714B67">174 725 DA (marge 40%)</text>

  <!-- ===== SEPARATOR ===== -->
  <line x1="700" y1="90" x2="700" y2="530" stroke="#ccc" stroke-width="1.5" stroke-dasharray="10,5"/>

  <!-- ===== PACK RÉSEAU (right) ===== -->
  <rect x="850" y="80" width="340" height="90" rx="12" fill="#0277bd" filter="url(#shadow)"/>
  <text x="1020" y="115" text-anchor="middle" font-size="20" font-weight="bold" fill="white">Pack Réseau Agence</text>
  <text x="1020" y="142" text-anchor="middle" font-size="14" fill="#b3e5fc">PACK-NET-001 | Vente : 58 000 DA</text>

  <!-- Lines from Pack Réseau to components -->
  <line x1="1020" y1="170" x2="870" y2="210" stroke="#0277bd" stroke-width="2"/>
  <line x1="1020" y1="170" x2="1050" y2="210" stroke="#0277bd" stroke-width="2"/>
  <line x1="1020" y1="170" x2="1230" y2="210" stroke="#0277bd" stroke-width="2"/>

  <!-- Component 1: Switch -->
  <rect x="790" y="210" width="160" height="100" rx="8" fill="#e1f5fe" stroke="#0277bd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="870" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#0277bd">TP-Link TL-SG1024</text>
  <text x="870" y="258" text-anchor="middle" font-size="12" fill="#333">SWITCH-001</text>
  <text x="870" y="278" text-anchor="middle" font-size="13" fill="#333">Qté : 1</text>
  <text x="870" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#0277bd">18 000 DA</text>

  <!-- Component 2: Routeurs -->
  <rect x="970" y="210" width="160" height="100" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1050" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">MikroTik hEX S</text>
  <text x="1050" y="258" text-anchor="middle" font-size="12" fill="#333">RTR-001</text>
  <text x="1050" y="278" text-anchor="middle" font-size="13" fill="#333">Qté : 2</text>
  <text x="1050" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">22 000 DA</text>

  <!-- Component 3: Cables -->
  <rect x="1150" y="210" width="160" height="100" rx="8" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1230" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#7b1fa2">Câble Cat6 UTP</text>
  <text x="1230" y="258" text-anchor="middle" font-size="12" fill="#333">CABLE-001</text>
  <text x="1230" y="278" text-anchor="middle" font-size="13" fill="#333">Qté : 10 m</text>
  <text x="1230" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#7b1fa2">450 DA</text>

  <!-- Total cost Pack Réseau -->
  <rect x="850" y="470" width="340" height="55" rx="8" fill="#e3f5fc" stroke="#0277bd" stroke-width="1.5"/>
  <text x="1020" y="495" text-anchor="middle" font-size="15" fill="#333">Coût total composants :</text>
  <text x="1020" y="515" text-anchor="middle" font-size="18" font-weight="bold" fill="#0277bd">40 450 DA (marge 43%)</text>

  <!-- Legend -->
  <rect x="1450" y="90" width="310" height="200" rx="10" fill="white" stroke="#ccc" stroke-width="1" filter="url(#shadow)"/>
  <text x="1605" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Légende</text>
  <rect x="1470" y="140" width="20" height="14" rx="3" fill="#714B67"/>
  <text x="1500" y="152" font-size="13" fill="#333">Produit assemblé (Pack)</text>
  <rect x="1470" y="170" width="20" height="14" rx="3" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
  <text x="1500" y="182" font-size="13" fill="#333">Composant (matière première)</text>
  <rect x="1470" y="200" width="20" height="14" rx="3" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1"/>
  <text x="1500" y="212" font-size="13" fill="#333">Composant partagé</text>
  <text x="1605" y="250" text-anchor="middle" font-size="12" fill="#666">Le câble Cat6 est utilisé</text>
  <text x="1605" y="268" text-anchor="middle" font-size="12" fill="#666">dans les deux nomenclatures</text>
</svg>
