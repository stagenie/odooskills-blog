<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <linearGradient id="grad-pg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#336791"/>
      <stop offset="100%" stop-color="#264F73"/>
    </linearGradient>
    <linearGradient id="grad-odoo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#714B67"/>
      <stop offset="100%" stop-color="#5B3A54"/>
    </linearGradient>
    <linearGradient id="grad-browser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" rx="12" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" font-size="16" font-weight="600" fill="#333">Architecture d'une installation Odoo 19 depuis les sources</text>

  <!-- PostgreSQL 16 Box -->
  <rect x="40" y="70" width="200" height="200" rx="12" fill="url(#grad-pg)" filter="url(#shadow)"/>
  <text x="140" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="white">PostgreSQL 16</text>
  <line x1="70" y1="120" x2="210" y2="120" stroke="white" stroke-opacity="0.3"/>
  <text x="140" y="146" text-anchor="middle" font-size="12" fill="#cde">Port 5432</text>
  <text x="140" y="168" text-anchor="middle" font-size="12" fill="#cde">User : odoo19</text>
  <text x="140" y="190" text-anchor="middle" font-size="12" fill="#cde">Bases de donnees</text>
  <text x="140" y="212" text-anchor="middle" font-size="12" fill="#cde">ORM / SQL</text>
  <!-- PG Icon placeholder -->
  <rect x="115" y="228" width="50" height="26" rx="4" fill="white" fill-opacity="0.15"/>
  <text x="140" y="246" text-anchor="middle" font-size="11" font-weight="600" fill="white">SGBD</text>

  <!-- Odoo Server Box -->
  <rect x="300" y="70" width="200" height="200" rx="12" fill="url(#grad-odoo)" filter="url(#shadow)"/>
  <text x="400" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="white">odoo-bin</text>
  <line x1="330" y1="120" x2="470" y2="120" stroke="white" stroke-opacity="0.3"/>
  <text x="400" y="146" text-anchor="middle" font-size="12" fill="#e8d0e0">Python 3.12 + venv</text>
  <text x="400" y="168" text-anchor="middle" font-size="12" fill="#e8d0e0">Port HTTP 8069</text>
  <text x="400" y="190" text-anchor="middle" font-size="12" fill="#e8d0e0">Port WS 8072</text>
  <text x="400" y="212" text-anchor="middle" font-size="12" fill="#e8d0e0">odoo.conf</text>
  <rect x="367" y="228" width="66" height="26" rx="4" fill="white" fill-opacity="0.15"/>
  <text x="400" y="246" text-anchor="middle" font-size="11" font-weight="600" fill="white">Serveur</text>

  <!-- Browser Box -->
  <rect x="560" y="70" width="200" height="200" rx="12" fill="url(#grad-browser)" filter="url(#shadow)"/>
  <text x="660" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="white">Navigateur</text>
  <line x1="590" y1="120" x2="730" y2="120" stroke="white" stroke-opacity="0.3"/>
  <text x="660" y="146" text-anchor="middle" font-size="12" fill="#bbdefb">http://localhost:8069</text>
  <text x="660" y="168" text-anchor="middle" font-size="12" fill="#bbdefb">Interface web</text>
  <text x="660" y="190" text-anchor="middle" font-size="12" fill="#bbdefb">OWL (JavaScript)</text>
  <text x="660" y="212" text-anchor="middle" font-size="12" fill="#bbdefb">HTML / CSS / QWeb</text>
  <rect x="627" y="228" width="66" height="26" rx="4" fill="white" fill-opacity="0.15"/>
  <text x="660" y="246" text-anchor="middle" font-size="11" font-weight="600" fill="white">Client</text>

  <!-- Arrow PG → Odoo -->
  <line x1="244" y1="155" x2="296" y2="155" stroke="#555" stroke-width="2" marker-end="url(#arrowR)"/>
  <line x1="296" y1="175" x2="244" y2="175" stroke="#555" stroke-width="2" marker-end="url(#arrowL)"/>
  <text x="270" y="148" text-anchor="middle" font-size="10" fill="#666">SQL</text>
  <text x="270" y="192" text-anchor="middle" font-size="10" fill="#666">ORM</text>

  <!-- Arrow Odoo → Browser -->
  <line x1="504" y1="155" x2="556" y2="155" stroke="#555" stroke-width="2" marker-end="url(#arrowR)"/>
  <line x1="556" y1="175" x2="504" y2="175" stroke="#555" stroke-width="2" marker-end="url(#arrowL)"/>
  <text x="530" y="148" text-anchor="middle" font-size="10" fill="#666">JSON</text>
  <text x="530" y="192" text-anchor="middle" font-size="10" fill="#666">HTTP</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrowL" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6 Z" fill="#555"/>
    </marker>
  </defs>

  <!-- Bottom labels -->
  <text x="140" y="302" text-anchor="middle" font-size="11" fill="#888">apt install postgresql</text>
  <text x="400" y="302" text-anchor="middle" font-size="11" fill="#888">git clone + venv + pip</text>
  <text x="660" y="302" text-anchor="middle" font-size="11" fill="#888">Chrome / Firefox</text>
</svg>
