<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <!-- Title -->
  <text x="480" y="25" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Flux de vente complet dans Odoo 19</text>

  <!-- Row 1: Sales flow -->
  <text x="30" y="60" font-size="13" fill="#714B67" font-weight="bold">MODULE VENTES</text>

  <!-- Quotation -->
  <rect x="30" y="70" width="130" height="60" rx="8" fill="#e8d5e0" stroke="#714B67" stroke-width="2"/>
  <text x="95" y="95" text-anchor="middle" fill="#714B67" font-weight="bold">Devis</text>
  <text x="95" y="112" text-anchor="middle" fill="#714B67" font-size="11">(Brouillon)</text>

  <!-- Arrow -->
  <line x1="160" y1="100" x2="200" y2="100" stroke="#714B67" stroke-width="2.5" marker-end="url(#arrV1)"/>

  <!-- SO confirmed -->
  <rect x="200" y="70" width="130" height="60" rx="8" fill="#714B67" stroke="#5a3a52" stroke-width="2"/>
  <text x="265" y="95" text-anchor="middle" fill="white" font-weight="bold">Commande</text>
  <text x="265" y="112" text-anchor="middle" fill="#ddd" font-size="11">(Confirmée)</text>

  <!-- Arrow right to Invoice -->
  <line x1="330" y1="100" x2="370" y2="100" stroke="#714B67" stroke-width="2.5" marker-end="url(#arrV1)"/>

  <!-- Invoice -->
  <rect x="370" y="70" width="130" height="60" rx="8" fill="#dc3545" stroke="#b02a37" stroke-width="2"/>
  <text x="435" y="95" text-anchor="middle" fill="white" font-weight="bold">Facture</text>
  <text x="435" y="112" text-anchor="middle" fill="#f8d7da" font-size="11">(Après livraison)</text>

  <!-- Arrow down to Inventory -->
  <line x1="265" y1="130" x2="265" y2="165" stroke="#714B67" stroke-width="2.5" marker-end="url(#arrV1)"/>
  <text x="280" y="152" font-size="10" fill="#714B67" font-style="italic">auto</text>

  <!-- Row 2: Inventory flow (2-step delivery) -->
  <text x="30" y="180" font-size="13" fill="#198754" font-weight="bold">MODULE INVENTAIRE (2 étapes)</text>

  <!-- PICK -->
  <rect x="200" y="190" width="130" height="55" rx="8" fill="#198754" stroke="#157347" stroke-width="2"/>
  <text x="265" y="213" text-anchor="middle" fill="white" font-weight="bold" font-size="13">Préparation</text>
  <text x="265" y="230" text-anchor="middle" fill="#d1e7dd" font-size="11">ALG/PICK</text>

  <!-- Arrow -->
  <line x1="330" y1="218" x2="390" y2="218" stroke="#198754" stroke-width="2.5" marker-end="url(#arrV2)"/>

  <!-- OUT -->
  <rect x="390" y="190" width="130" height="55" rx="8" fill="#0dcaf0" stroke="#0aa2c0" stroke-width="2"/>
  <text x="455" y="213" text-anchor="middle" fill="white" font-weight="bold" font-size="13">Expédition</text>
  <text x="455" y="230" text-anchor="middle" fill="#e0f7fa" font-size="11">ALG/OUT</text>

  <!-- Arrow to Client -->
  <line x1="520" y1="218" x2="580" y2="218" stroke="#0dcaf0" stroke-width="2.5" marker-end="url(#arrV3)"/>

  <!-- Client -->
  <rect x="580" y="190" width="140" height="55" rx="8" fill="#6c757d" stroke="#5a6268" stroke-width="2"/>
  <text x="650" y="213" text-anchor="middle" fill="white" font-weight="bold" font-size="13">Client</text>
  <text x="650" y="230" text-anchor="middle" fill="#ddd" font-size="11">Réseau Plus</text>

  <!-- Dashed box around inventory -->
  <rect x="190" y="175" width="540" height="85" rx="10" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- Legend -->
  <text x="480" y="275" text-anchor="middle" font-size="11" fill="#999">La confirmation de la commande déclenche automatiquement la livraison en 2 étapes (pick + ship)</text>

  <defs>
    <marker id="arrV1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#714B67"/>
    </marker>
    <marker id="arrV2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#198754"/>
    </marker>
    <marker id="arrV3" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0dcaf0"/>
    </marker>
  </defs>
</svg>
