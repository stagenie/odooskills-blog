<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <!-- Title -->
  <text x="480" y="25" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Flux d'achat complet dans Odoo 19</text>

  <!-- Row 1: Purchase flow -->
  <text x="30" y="60" font-size="13" fill="#714B67" font-weight="bold">MODULE ACHATS</text>

  <!-- RFQ -->
  <rect x="30" y="70" width="140" height="60" rx="8" fill="#e8d5e0" stroke="#714B67" stroke-width="2"/>
  <text x="100" y="95" text-anchor="middle" fill="#714B67" font-weight="bold">Demande de prix</text>
  <text x="100" y="112" text-anchor="middle" fill="#714B67" font-size="11">(RFQ) — Brouillon</text>

  <!-- Arrow -->
  <line x1="170" y1="100" x2="210" y2="100" stroke="#714B67" stroke-width="2.5" marker-end="url(#arr1)"/>

  <!-- PO confirmed -->
  <rect x="210" y="70" width="140" height="60" rx="8" fill="#714B67" stroke="#5a3a52" stroke-width="2"/>
  <text x="280" y="95" text-anchor="middle" fill="white" font-weight="bold">Bon de commande</text>
  <text x="280" y="112" text-anchor="middle" fill="#ddd" font-size="11">(PO) — Confirmé</text>

  <!-- Arrow down to Inventory -->
  <line x1="280" y1="130" x2="280" y2="165" stroke="#714B67" stroke-width="2.5" marker-end="url(#arr1)"/>
  <text x="295" y="152" font-size="10" fill="#714B67" font-style="italic">auto</text>

  <!-- Row 2: Inventory flow (3-step reception) -->
  <text x="30" y="180" font-size="13" fill="#0d6efd" font-weight="bold">MODULE INVENTAIRE (3 étapes)</text>

  <!-- IN -->
  <rect x="210" y="190" width="120" height="55" rx="8" fill="#0d6efd" stroke="#0b5ed7" stroke-width="2"/>
  <text x="270" y="213" text-anchor="middle" fill="white" font-weight="bold" font-size="13">Réception</text>
  <text x="270" y="230" text-anchor="middle" fill="#cfe2ff" font-size="11">ALG/IN</text>

  <!-- Arrow -->
  <line x1="330" y1="218" x2="380" y2="218" stroke="#0d6efd" stroke-width="2.5" marker-end="url(#arr2)"/>

  <!-- QC -->
  <rect x="380" y="190" width="120" height="55" rx="8" fill="#fd7e14" stroke="#e8690a" stroke-width="2"/>
  <text x="440" y="213" text-anchor="middle" fill="white" font-weight="bold" font-size="13">Contrôle QC</text>
  <text x="440" y="230" text-anchor="middle" fill="#ffe5d0" font-size="11">ALG/QC</text>

  <!-- Arrow -->
  <line x1="500" y1="218" x2="550" y2="218" stroke="#fd7e14" stroke-width="2.5" marker-end="url(#arr3)"/>

  <!-- STOR -->
  <rect x="550" y="190" width="120" height="55" rx="8" fill="#198754" stroke="#157347" stroke-width="2"/>
  <text x="610" y="213" text-anchor="middle" fill="white" font-weight="bold" font-size="13">Stockage</text>
  <text x="610" y="230" text-anchor="middle" fill="#d1e7dd" font-size="11">ALG/STOR</text>

  <!-- Arrow to final -->
  <line x1="670" y1="218" x2="720" y2="218" stroke="#198754" stroke-width="2.5" marker-end="url(#arr4)"/>

  <!-- Stock available -->
  <rect x="720" y="190" width="140" height="55" rx="8" fill="#d1e7dd" stroke="#198754" stroke-width="2"/>
  <text x="790" y="213" text-anchor="middle" fill="#155724" font-weight="bold" font-size="13">En stock</text>
  <text x="790" y="230" text-anchor="middle" fill="#198754" font-size="11">Disponible</text>

  <!-- Dashed box around inventory -->
  <rect x="200" y="175" width="670" height="85" rx="10" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- Legend -->
  <text x="480" y="275" text-anchor="middle" font-size="11" fill="#999">La confirmation du bon de commande déclenche automatiquement la réception en 3 étapes</text>

  <defs>
    <marker id="arr1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#714B67"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d6efd"/>
    </marker>
    <marker id="arr3" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fd7e14"/>
    </marker>
    <marker id="arr4" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#198754"/>
    </marker>
  </defs>
</svg>
