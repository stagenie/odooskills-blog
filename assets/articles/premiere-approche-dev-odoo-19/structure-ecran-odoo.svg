<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="navGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#714B67;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#5a3a52;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="menuGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e8e8e8;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Browser frame -->
  <rect x="10" y="10" width="840" height="380" rx="10" fill="white" stroke="#ddd" stroke-width="2" filter="url(#shadow)"/>

  <!-- Browser tab bar -->
  <rect x="10" y="10" width="840" height="30" rx="10" fill="#f0f0f0"/>
  <rect x="10" y="30" width="840" height="10" fill="#f0f0f0"/>
  <circle cx="30" cy="25" r="5" fill="#ff5f57"/>
  <circle cx="50" cy="25" r="5" fill="#ffbd2e"/>
  <circle cx="70" cy="25" r="5" fill="#28c840"/>
  <rect x="100" y="16" width="180" height="18" rx="4" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="190" y="30" text-anchor="middle" fill="#666" font-size="9">localhost:8069/odoo/sales</text>

  <!-- 1. Navbar (top) -->
  <rect x="10" y="40" width="840" height="44" fill="url(#navGrad)"/>
  <text x="30" y="67" fill="white" font-size="14" font-weight="bold">Odoo</text>
  <text x="100" y="67" fill="rgba(255,255,255,0.8)" font-size="12">Ventes</text>
  <text x="160" y="67" fill="rgba(255,255,255,0.8)" font-size="12">Inventaire</text>
  <text x="240" y="67" fill="rgba(255,255,255,0.8)" font-size="12">Comptabilité</text>
  <text x="340" y="67" fill="rgba(255,255,255,0.8)" font-size="12">CRM</text>

  <!-- Label 1 -->
  <rect x="660" y="46" width="180" height="32" rx="4" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="750" y="67" text-anchor="middle" fill="#FFD700" font-size="10" font-weight="bold">1. Navbar (ir.ui.menu)</text>

  <!-- 2. Menu secondaire -->
  <rect x="10" y="84" width="840" height="36" fill="url(#menuGrad)"/>
  <text x="30" y="107" fill="#714B67" font-size="12" font-weight="600">Commandes</text>
  <text x="120" y="107" fill="#555" font-size="12">Devis</text>
  <text x="175" y="107" fill="#555" font-size="12">Clients</text>
  <text x="240" y="107" fill="#555" font-size="12">Produits</text>
  <text x="310" y="107" fill="#555" font-size="12">Configuration</text>

  <!-- Label 2 -->
  <rect x="660" y="88" width="180" height="28" rx="4" fill="rgba(113,75,103,0.08)" stroke="#714B67" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="750" y="107" text-anchor="middle" fill="#714B67" font-size="10" font-weight="bold">2. Sous-menus</text>

  <!-- 3. Control Panel (search + buttons) -->
  <rect x="10" y="120" width="840" height="44" fill="#fafafa" stroke-bottom="#eee"/>
  <rect x="20" y="130" width="80" height="26" rx="4" fill="#714B67"/>
  <text x="60" y="148" text-anchor="middle" fill="white" font-size="11" font-weight="600">Nouveau</text>
  <rect x="500" y="130" width="200" height="26" rx="13" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="600" y="148" text-anchor="middle" fill="#999" font-size="11">Rechercher...</text>
  <rect x="720" y="130" width="24" height="26" rx="4" fill="#eee"/>
  <text x="732" y="148" text-anchor="middle" fill="#666" font-size="12">☰</text>
  <rect x="750" y="130" width="24" height="26" rx="4" fill="#eee"/>
  <text x="762" y="148" text-anchor="middle" fill="#666" font-size="12">⊞</text>

  <!-- Label 3 -->
  <rect x="130" y="128" width="180" height="28" rx="4" fill="rgba(0,122,204,0.08)" stroke="#007ACC" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="220" y="147" text-anchor="middle" fill="#007ACC" font-size="10" font-weight="bold">3. ControlPanel (actions)</text>

  <!-- 4. Content area - List view -->
  <rect x="10" y="164" width="840" height="196" fill="white"/>

  <!-- List header -->
  <rect x="10" y="164" width="840" height="30" fill="#f8f9fa"/>
  <text x="30" y="183" fill="#333" font-size="11" font-weight="600">☐</text>
  <text x="60" y="183" fill="#333" font-size="11" font-weight="600">Numéro</text>
  <text x="200" y="183" fill="#333" font-size="11" font-weight="600">Client</text>
  <text x="400" y="183" fill="#333" font-size="11" font-weight="600">Date</text>
  <text x="550" y="183" fill="#333" font-size="11" font-weight="600">Vendeur</text>
  <text x="700" y="183" fill="#333" font-size="11" font-weight="600">Total TTC</text>

  <!-- Row 1 -->
  <text x="30" y="213" fill="#333" font-size="11">☐</text>
  <text x="60" y="213" fill="#007ACC" font-size="11">S00042</text>
  <text x="200" y="213" fill="#333" font-size="11">InfoSphere SARL</text>
  <text x="400" y="213" fill="#333" font-size="11">11/04/2026</text>
  <text x="550" y="213" fill="#333" font-size="11">Admin</text>
  <text x="700" y="213" fill="#333" font-size="11">245 000,00 DA</text>
  <line x1="10" y1="224" x2="850" y2="224" stroke="#eee" stroke-width="1"/>

  <!-- Row 2 -->
  <text x="30" y="243" fill="#333" font-size="11">☐</text>
  <text x="60" y="243" fill="#007ACC" font-size="11">S00041</text>
  <text x="200" y="243" fill="#333" font-size="11">TechPro Algérie</text>
  <text x="400" y="243" fill="#333" font-size="11">10/04/2026</text>
  <text x="550" y="243" fill="#333" font-size="11">Admin</text>
  <text x="700" y="243" fill="#333" font-size="11">127 500,00 DA</text>
  <line x1="10" y1="254" x2="850" y2="254" stroke="#eee" stroke-width="1"/>

  <!-- Row 3 -->
  <text x="30" y="273" fill="#333" font-size="11">☐</text>
  <text x="60" y="273" fill="#007ACC" font-size="11">S00040</text>
  <text x="200" y="273" fill="#333" font-size="11">Global Services</text>
  <text x="400" y="273" fill="#333" font-size="11">09/04/2026</text>
  <text x="550" y="273" fill="#333" font-size="11">Admin</text>
  <text x="700" y="273" fill="#333" font-size="11">89 000,00 DA</text>

  <!-- Label 4 -->
  <rect x="30" y="296" width="200" height="28" rx="4" fill="rgba(76,175,80,0.08)" stroke="#4CAF50" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="130" y="315" text-anchor="middle" fill="#4CAF50" font-size="10" font-weight="bold">4. Vue (list / form / kanban)</text>

  <!-- 5. Status bar -->
  <rect x="10" y="360" width="840" height="30" rx="0" fill="#f8f9fa" stroke-top="#eee"/>
  <text x="30" y="379" fill="#888" font-size="10">3 enregistrements</text>
  <text x="700" y="379" fill="#888" font-size="10">1-3 / 3</text>

  <!-- Label 5 -->
  <rect x="300" y="362" width="200" height="24" rx="4" fill="rgba(255,152,0,0.08)" stroke="#FF9800" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="400" y="379" text-anchor="middle" fill="#FF9800" font-size="10" font-weight="bold">5. Pager + compteur</text>
</svg>