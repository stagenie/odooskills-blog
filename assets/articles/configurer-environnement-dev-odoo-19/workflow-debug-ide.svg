<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="ideGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#007ACC;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#005a9e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="odooGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#714B67;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#5a3a52;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#336791;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#264f73;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="browserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#E65100;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bbb"/>
    </marker>
  </defs>

  <!-- IDE Box -->
  <rect x="20" y="40" width="200" height="200" rx="12" fill="url(#ideGrad)" filter="url(#shadow)"/>
  <text x="120" y="75" text-anchor="middle" fill="white" font-size="17" font-weight="bold">IDE</text>
  <line x1="45" y1="88" x2="195" y2="88" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="120" y="112" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="12">VS Code / PyCharm</text>
  <text x="120" y="136" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11">Interpréteur : venv</text>
  <text x="120" y="156" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11">Breakpoints</text>
  <text x="120" y="176" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11">Autocomplétion</text>
  <rect x="40" y="194" width="160" height="28" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="120" y="213" text-anchor="middle" fill="white" font-size="11" font-weight="600">launch.json / Run Config</text>

  <!-- Arrow IDE -> odoo-bin -->
  <line x1="220" y1="120" x2="280" y2="120" stroke="#bbb" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="250" y="112" text-anchor="middle" fill="#888" font-size="10">Debug</text>
  <text x="250" y="138" text-anchor="middle" fill="#888" font-size="10">F5</text>

  <!-- odoo-bin Box -->
  <rect x="280" y="40" width="200" height="200" rx="12" fill="url(#odooGrad)" filter="url(#shadow)"/>
  <text x="380" y="75" text-anchor="middle" fill="white" font-size="17" font-weight="bold">odoo-bin</text>
  <line x1="305" y1="88" x2="455" y2="88" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="380" y="112" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="12">Python 3.12 (venv)</text>
  <text x="380" y="136" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11">Port 8069</text>
  <text x="380" y="156" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11">--dev=all</text>
  <text x="380" y="176" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11">odoo.conf</text>
  <rect x="300" y="194" width="160" height="28" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="380" y="213" text-anchor="middle" fill="white" font-size="11" font-weight="600">Rechargement auto</text>

  <!-- Arrow odoo-bin -> DB -->
  <line x1="480" y1="100" x2="540" y2="100" stroke="#bbb" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="510" y="92" text-anchor="middle" fill="#888" font-size="10">ORM</text>

  <!-- Arrow odoo-bin -> Browser -->
  <line x1="480" y1="180" x2="540" y2="180" stroke="#bbb" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="510" y="172" text-anchor="middle" fill="#888" font-size="10">HTTP</text>

  <!-- DB Box -->
  <rect x="540" y="30" width="170" height="110" rx="12" fill="url(#dbGrad)" filter="url(#shadow)"/>
  <text x="625" y="62" text-anchor="middle" fill="white" font-size="15" font-weight="bold">PostgreSQL</text>
  <line x1="560" y1="74" x2="690" y2="74" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="625" y="96" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="11">Port 5432</text>
  <text x="625" y="116" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11">Base : odoo19_dev</text>

  <!-- Browser Box -->
  <rect x="540" y="155" width="170" height="110" rx="12" fill="url(#browserGrad)" filter="url(#shadow)"/>
  <text x="625" y="187" text-anchor="middle" fill="white" font-size="15" font-weight="bold">Navigateur</text>
  <line x1="560" y1="199" x2="690" y2="199" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="625" y="221" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="11">localhost:8069</text>
  <text x="625" y="241" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11">Test en temps réel</text>

  <!-- Feedback arrow Browser -> IDE (curved) -->
  <path d="M 625 265 Q 625 275, 120 275 Q 40 275, 40 240" fill="none" stroke="#4CAF50" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowR)"/>
  <text x="380" y="272" text-anchor="middle" fill="#4CAF50" font-size="10" font-style="italic">Boucle de feedback : modifier, sauvegarder, recharger</text>
</svg>