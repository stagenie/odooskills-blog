<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="9" refX="12" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#714B67"/>
    </marker>
  </defs>

  <rect width="1800" height="600" rx="14" fill="url(#bg)"/>

  <!-- Title -->
  <text x="900" y="50" text-anchor="middle" font-size="28" font-weight="bold" fill="#333">Workflow Facturation &amp; Paiement — Odoo 19</text>
  <text x="900" y="78" text-anchor="middle" font-size="16" fill="#666">InfoSphere — Commande S00001 → Facture → Paiement → Lettrage</text>

  <!-- Step 1: Vente -->
  <rect x="30" y="110" width="260" height="160" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="160" y="148" text-anchor="middle" font-size="18" font-weight="bold" fill="#1565c0">1. Commande de vente</text>
  <line x1="60" y1="158" x2="260" y2="158" stroke="#1565c0" stroke-width="0.5" opacity="0.4"/>
  <text x="160" y="185" text-anchor="middle" font-size="15" fill="#333">S00001 — Réseau Plus</text>
  <text x="160" y="210" text-anchor="middle" font-size="15" fill="#333">442 000 DA HT</text>
  <text x="160" y="245" text-anchor="middle" font-size="13" fill="#666">État : Confirmée</text>

  <!-- Arrow 1→2 -->
  <line x1="290" y1="190" x2="360" y2="190" stroke="#714B67" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="325" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#714B67">Créer</text>
  <text x="325" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#714B67">facture</text>

  <!-- Step 2: Brouillon -->
  <rect x="370" y="110" width="260" height="160" rx="12" fill="#fff3e0" stroke="#e65100" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="500" y="148" text-anchor="middle" font-size="18" font-weight="bold" fill="#e65100">2. Facture brouillon</text>
  <line x1="400" y1="158" x2="600" y2="158" stroke="#e65100" stroke-width="0.5" opacity="0.4"/>
  <text x="500" y="185" text-anchor="middle" font-size="15" fill="#333">3 lignes + TVA 19%</text>
  <text x="500" y="210" text-anchor="middle" font-size="15" fill="#333">525 980 DA TTC</text>
  <text x="500" y="245" text-anchor="middle" font-size="13" fill="#666">Modifiable, sans impact comptable</text>

  <!-- Arrow 2→3 -->
  <line x1="630" y1="190" x2="700" y2="190" stroke="#714B67" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="665" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#714B67">Confirmer</text>

  <!-- Step 3: Validée -->
  <rect x="710" y="110" width="260" height="160" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="840" y="148" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e7d32">3. Facture validée</text>
  <line x1="740" y1="158" x2="940" y2="158" stroke="#2e7d32" stroke-width="0.5" opacity="0.4"/>
  <text x="840" y="185" text-anchor="middle" font-size="15" fill="#333">FAC/2026/00001</text>
  <text x="840" y="210" text-anchor="middle" font-size="15" fill="#333">Écritures comptables</text>
  <text x="840" y="245" text-anchor="middle" font-size="13" fill="#666">Non modifiable</text>

  <!-- Arrow 3→4 -->
  <line x1="970" y1="190" x2="1040" y2="190" stroke="#714B67" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1005" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#714B67">Payer</text>

  <!-- Step 4: Paiement -->
  <rect x="1050" y="110" width="260" height="160" rx="12" fill="#fce4ec" stroke="#c62828" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1180" y="148" text-anchor="middle" font-size="18" font-weight="bold" fill="#c62828">4. Paiement</text>
  <line x1="1080" y1="158" x2="1280" y2="158" stroke="#c62828" stroke-width="0.5" opacity="0.4"/>
  <text x="1180" y="185" text-anchor="middle" font-size="15" fill="#333">PBNK1/2026/00001</text>
  <text x="1180" y="210" text-anchor="middle" font-size="15" fill="#333">Journal : Banque</text>
  <text x="1180" y="245" text-anchor="middle" font-size="13" fill="#666">525 980 DA</text>

  <!-- Arrow 4→5 -->
  <line x1="1310" y1="190" x2="1380" y2="190" stroke="#714B67" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1345" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#714B67">Lettrage</text>

  <!-- Step 5: Payée -->
  <rect x="1390" y="110" width="260" height="160" rx="12" fill="#e8eaf6" stroke="#283593" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1520" y="148" text-anchor="middle" font-size="18" font-weight="bold" fill="#283593">5. Facture payée</text>
  <line x1="1420" y1="158" x2="1620" y2="158" stroke="#283593" stroke-width="0.5" opacity="0.4"/>
  <text x="1520" y="185" text-anchor="middle" font-size="15" fill="#333">Montant résiduel : 0</text>
  <text x="1520" y="210" text-anchor="middle" font-size="15" fill="#333">Lettrage automatique</text>
  <text x="1520" y="245" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold">&#x2713; Payé</text>

  <!-- Accounting entries below -->
  <rect x="30" y="320" width="1620" height="260" rx="12" fill="white" stroke="#714B67" stroke-width="2" stroke-dasharray="10,5" filter="url(#shadow)"/>
  <text x="60" y="355" font-size="18" font-weight="bold" fill="#714B67">Écritures comptables générées automatiquement :</text>

  <!-- Facture entries -->
  <rect x="55" y="375" width="480" height="110" rx="8" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="295" y="402" text-anchor="middle" font-size="16" font-weight="bold" fill="#7b1fa2">Facture FAC/2026/00001</text>
  <line x1="85" y1="412" x2="505" y2="412" stroke="#7b1fa2" stroke-width="0.5" opacity="0.3"/>
  <text x="295" y="438" text-anchor="middle" font-size="14" fill="#333">Débit : 413000 Clients &#x2192; 525 980 DA</text>
  <text x="295" y="462" text-anchor="middle" font-size="14" fill="#333">Crédit : 700000 Ventes &#x2192; 442 000 DA</text>
  <text x="295" y="478" text-anchor="middle" font-size="13" fill="#555">445700 TVA collectée &#x2192; 83 980 DA</text>

  <!-- Arrow -->
  <line x1="545" y1="430" x2="610" y2="430" stroke="#714B67" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Payment entries -->
  <rect x="620" y="375" width="480" height="110" rx="8" fill="#e1f5fe" stroke="#0277bd" stroke-width="1.5"/>
  <text x="860" y="402" text-anchor="middle" font-size="16" font-weight="bold" fill="#0277bd">Paiement PBNK1/2026/00001</text>
  <line x1="650" y1="412" x2="1070" y2="412" stroke="#0277bd" stroke-width="0.5" opacity="0.3"/>
  <text x="860" y="438" text-anchor="middle" font-size="14" fill="#333">Débit : 512003 Encaissements &#x2192; 525 980 DA</text>
  <text x="860" y="462" text-anchor="middle" font-size="14" fill="#333">Crédit : 413000 Clients &#x2192; 525 980 DA</text>

  <!-- Arrow -->
  <line x1="1110" y1="430" x2="1175" y2="430" stroke="#714B67" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Reconciliation -->
  <rect x="1185" y="375" width="445" height="110" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="1407" y="402" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e7d32">Lettrage automatique</text>
  <line x1="1215" y1="412" x2="1600" y2="412" stroke="#2e7d32" stroke-width="0.5" opacity="0.3"/>
  <text x="1407" y="438" text-anchor="middle" font-size="14" fill="#333">Compte 413000 :</text>
  <text x="1407" y="462" text-anchor="middle" font-size="14" fill="#333">débit 525 980 = crédit 525 980</text>
  <text x="1407" y="478" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">Solde Réseau Plus : 0 DA &#x2713;</text>

  <!-- Connection lines from steps to entries -->
  <line x1="840" y1="270" x2="295" y2="370" stroke="#7b1fa2" stroke-width="1" stroke-dasharray="5,3" opacity="0.4"/>
  <line x1="1180" y1="270" x2="860" y2="370" stroke="#0277bd" stroke-width="1" stroke-dasharray="5,3" opacity="0.4"/>
  <line x1="1520" y1="270" x2="1407" y2="370" stroke="#2e7d32" stroke-width="1" stroke-dasharray="5,3" opacity="0.4"/>
</svg>
