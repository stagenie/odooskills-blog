<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="dockerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2496ED;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a75c4;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="pgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#336791;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#264f73;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="odooGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#714B67;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#5a3a52;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="volGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#388E3C;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="browserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#E65100;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bbb"/>
    </marker>
    <marker id="arrowL" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#bbb"/>
    </marker>
    <marker id="arrowD" markerWidth="6" markerHeight="8" refX="3" refY="8" orient="auto">
      <polygon points="0 0, 3 8, 6 0" fill="#bbb"/>
    </marker>
  </defs>

  <!-- Docker Engine background -->
  <rect x="10" y="10" width="840" height="310" rx="16" fill="#f0f7ff" stroke="#2496ED" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="430" y="38" text-anchor="middle" fill="#2496ED" font-size="15" font-weight="bold">Docker Engine</text>

  <!-- docker network: odoo-net -->
  <rect x="30" y="50" width="800" height="255" rx="10" fill="rgba(36,150,237,0.06)" stroke="#2496ED" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="430" y="72" text-anchor="middle" fill="#2496ED" font-size="12">Réseau : odoo-net</text>

  <!-- PostgreSQL Container -->
  <rect x="50" y="90" width="230" height="195" rx="12" fill="url(#pgGrad)" filter="url(#shadow)"/>
  <text x="165" y="122" text-anchor="middle" fill="white" font-size="17" font-weight="bold">db</text>
  <line x1="75" y1="134" x2="255" y2="134" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="165" y="156" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="12">postgres:16</text>
  <text x="165" y="178" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11">POSTGRES_USER=odoo</text>
  <text x="165" y="198" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11">POSTGRES_PASSWORD=odoo</text>
  <text x="165" y="218" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11">Port interne : 5432</text>
  <rect x="80" y="236" width="170" height="30" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="165" y="256" text-anchor="middle" fill="white" font-size="11" font-weight="600">/var/lib/postgresql/data</text>

  <!-- Odoo Container -->
  <rect x="340" y="90" width="230" height="195" rx="12" fill="url(#odooGrad)" filter="url(#shadow)"/>
  <text x="455" y="122" text-anchor="middle" fill="white" font-size="17" font-weight="bold">odoo</text>
  <line x1="365" y1="134" x2="545" y2="134" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="455" y="156" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="12">odoo:19.0</text>
  <text x="455" y="178" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11">Python 3.12 + wkhtmltopdf</text>
  <text x="455" y="198" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11">Port : 8069 &rarr; 8069</text>
  <text x="455" y="218" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11">Port : 8072 &rarr; 8072</text>
  <rect x="370" y="236" width="170" height="30" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="455" y="256" text-anchor="middle" fill="white" font-size="11" font-weight="600">/var/lib/odoo</text>

  <!-- Browser -->
  <rect x="630" y="110" width="185" height="150" rx="12" fill="url(#browserGrad)" filter="url(#shadow)"/>
  <text x="722" y="142" text-anchor="middle" fill="white" font-size="17" font-weight="bold">Navigateur</text>
  <line x1="655" y1="154" x2="790" y2="154" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="722" y="176" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="12">http://localhost:8069</text>
  <text x="722" y="198" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11">JavaScript / OWL</text>
  <text x="722" y="218" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11">HTML / CSS / QWeb</text>

  <!-- Volumes (below Docker Engine) -->
  <rect x="50" y="340" width="180" height="80" rx="10" fill="url(#volGrad)" filter="url(#shadow)"/>
  <text x="140" y="368" text-anchor="middle" fill="white" font-size="14" font-weight="bold">odoo-db</text>
  <text x="140" y="390" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="11">Volume PostgreSQL</text>
  <text x="140" y="408" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="10">Données persistantes</text>

  <rect x="260" y="340" width="180" height="80" rx="10" fill="url(#volGrad)" filter="url(#shadow)"/>
  <text x="350" y="368" text-anchor="middle" fill="white" font-size="14" font-weight="bold">odoo-data</text>
  <text x="350" y="390" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="11">Volume filestore</text>
  <text x="350" y="408" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="10">/var/lib/odoo</text>

  <rect x="470" y="340" width="180" height="80" rx="10" fill="url(#volGrad)" filter="url(#shadow)"/>
  <text x="560" y="368" text-anchor="middle" fill="white" font-size="14" font-weight="bold">./custom-addons</text>
  <text x="560" y="390" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="11">Bind mount</text>
  <text x="560" y="408" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="10">/mnt/extra-addons</text>

  <rect x="680" y="340" width="155" height="80" rx="10" fill="url(#volGrad)" filter="url(#shadow)"/>
  <text x="757" y="368" text-anchor="middle" fill="white" font-size="14" font-weight="bold">./odoo.conf</text>
  <text x="757" y="390" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="11">Bind mount</text>
  <text x="757" y="408" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="10">/etc/odoo/odoo.conf</text>

  <!-- Arrows db <-> odoo -->
  <line x1="280" y1="170" x2="340" y2="170" stroke="#bbb" stroke-width="2" marker-end="url(#arrowR)"/>
  <line x1="340" y1="200" x2="280" y2="200" stroke="#bbb" stroke-width="2" marker-end="url(#arrowL)"/>
  <text x="310" y="163" text-anchor="middle" fill="#888" font-size="10">SQL</text>
  <text x="310" y="218" text-anchor="middle" fill="#888" font-size="10">ORM</text>

  <!-- Arrows odoo <-> browser -->
  <line x1="570" y1="170" x2="630" y2="170" stroke="#bbb" stroke-width="2" marker-end="url(#arrowR)"/>
  <line x1="630" y1="200" x2="570" y2="200" stroke="#bbb" stroke-width="2" marker-end="url(#arrowL)"/>
  <text x="600" y="163" text-anchor="middle" fill="#888" font-size="10">JSON</text>
  <text x="600" y="218" text-anchor="middle" fill="#888" font-size="10">HTTP</text>

  <!-- Arrows volumes -> containers -->
  <line x1="140" y1="340" x2="140" y2="290" stroke="#4CAF50" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowD)"/>
  <line x1="350" y1="340" x2="430" y2="290" stroke="#4CAF50" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="560" y1="340" x2="480" y2="290" stroke="#4CAF50" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="730" y1="340" x2="510" y2="290" stroke="#4CAF50" stroke-width="1.5" stroke-dasharray="4,3"/>
</svg>