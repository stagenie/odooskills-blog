<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="9" refX="12" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#714B67"/>
    </marker>
  </defs>

  <rect width="1800" height="500" rx="14" fill="url(#bg)"/>

  <!-- Title -->
  <text x="900" y="45" text-anchor="middle" font-size="26" font-weight="bold" fill="#333">Workflow Ordre de Fabrication — Odoo 19</text>
  <text x="900" y="75" text-anchor="middle" font-size="16" fill="#666">ALG/MO/00001 — Pack PC Bureautique InfoSphere × 2</text>

  <!-- Step 1: Brouillon -->
  <rect x="40" y="110" width="280" height="140" rx="12" fill="#fff3e0" stroke="#e65100" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="180" y="145" text-anchor="middle" font-size="18" font-weight="bold" fill="#e65100">1. Brouillon</text>
  <line x1="70" y1="155" x2="290" y2="155" stroke="#e65100" stroke-width="0.5" opacity="0.4"/>
  <text x="180" y="180" text-anchor="middle" font-size="14" fill="#333">Créer l'OF depuis le menu</text>
  <text x="180" y="200" text-anchor="middle" font-size="14" fill="#333">Sélectionner produit + BOM</text>
  <text x="180" y="225" text-anchor="middle" font-size="13" fill="#666">Quantité : 2 packs</text>

  <!-- Arrow -->
  <line x1="320" y1="180" x2="400" y2="180" stroke="#714B67" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="360" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#714B67">Confirmer</text>

  <!-- Step 2: Confirmé -->
  <rect x="410" y="110" width="280" height="140" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="550" y="145" text-anchor="middle" font-size="18" font-weight="bold" fill="#1565c0">2. Confirmé</text>
  <line x1="440" y1="155" x2="660" y2="155" stroke="#1565c0" stroke-width="0.5" opacity="0.4"/>
  <text x="550" y="180" text-anchor="middle" font-size="14" fill="#333">Composants réservés</text>
  <text x="550" y="200" text-anchor="middle" font-size="14" fill="#333">Stock vérifié disponible</text>
  <text x="550" y="225" text-anchor="middle" font-size="13" fill="#666">4 composants × 2</text>

  <!-- Arrow -->
  <line x1="690" y1="180" x2="770" y2="180" stroke="#714B67" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="730" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#714B67">Produire</text>

  <!-- Step 3: En production -->
  <rect x="780" y="110" width="280" height="140" rx="12" fill="#fce4ec" stroke="#c62828" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="920" y="145" text-anchor="middle" font-size="18" font-weight="bold" fill="#c62828">3. À clôturer</text>
  <line x1="810" y1="155" x2="1030" y2="155" stroke="#c62828" stroke-width="0.5" opacity="0.4"/>
  <text x="920" y="180" text-anchor="middle" font-size="14" fill="#333">Saisir qté produites</text>
  <text x="920" y="200" text-anchor="middle" font-size="14" fill="#333">Consommation composants</text>
  <text x="920" y="225" text-anchor="middle" font-size="13" fill="#666">Vérifier les quantités</text>

  <!-- Arrow -->
  <line x1="1060" y1="180" x2="1140" y2="180" stroke="#714B67" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1100" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#714B67">Clôturer</text>

  <!-- Step 4: Terminé -->
  <rect x="1150" y="110" width="280" height="140" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1290" y="145" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e7d32">4. Terminé</text>
  <line x1="1180" y1="155" x2="1400" y2="155" stroke="#2e7d32" stroke-width="0.5" opacity="0.4"/>
  <text x="1290" y="180" text-anchor="middle" font-size="14" fill="#333">Produit fini en stock</text>
  <text x="1290" y="200" text-anchor="middle" font-size="14" fill="#333">Composants déduits</text>
  <text x="1290" y="225" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold">&#x2713; 2 Pack PC produits</text>

  <!-- Impact stock section -->
  <rect x="40" y="290" width="680" height="185" rx="12" fill="white" stroke="#c62828" stroke-width="2" stroke-dasharray="10,5" filter="url(#shadow)"/>
  <text x="60" y="320" font-size="17" font-weight="bold" fill="#c62828">Composants consommés (sortie stock) :</text>

  <text x="60" y="350" font-size="14" fill="#333">&#x25BC; Dell Latitude 5450 ............... 2 unités</text>
  <text x="60" y="375" font-size="14" fill="#333">&#x25BC; Samsung 870 EVO 1TB ........... 2 unités</text>
  <text x="60" y="400" font-size="14" fill="#333">&#x25BC; APC Smart-UPS 1000VA .......... 2 unités</text>
  <text x="60" y="425" font-size="14" fill="#333">&#x25BC; Câble Cat6 UTP ..................... 10 mètres</text>
  <text x="60" y="458" font-size="14" font-weight="bold" fill="#c62828">Coût total consommé : 349 450 DA</text>

  <!-- Arrow between sections -->
  <line x1="730" y1="382" x2="790" y2="382" stroke="#714B67" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Product output -->
  <rect x="800" y="290" width="460" height="185" rx="12" fill="white" stroke="#2e7d32" stroke-width="2" stroke-dasharray="10,5" filter="url(#shadow)"/>
  <text x="820" y="320" font-size="17" font-weight="bold" fill="#2e7d32">Produit fini fabriqué (entrée stock) :</text>

  <text x="820" y="360" font-size="16" fill="#333">&#x25B2; Pack PC Bureautique InfoSphere</text>
  <text x="820" y="390" font-size="16" fill="#333">   Quantité : <tspan font-weight="bold">2 unités</tspan></text>
  <text x="820" y="420" font-size="14" fill="#333">   Coût unitaire : 174 725 DA</text>
  <text x="820" y="458" font-size="14" font-weight="bold" fill="#2e7d32">Valeur produite : 349 450 DA</text>

  <!-- Connection lines -->
  <line x1="920" y1="250" x2="380" y2="290" stroke="#c62828" stroke-width="1" stroke-dasharray="5,3" opacity="0.4"/>
  <line x1="1290" y1="250" x2="1030" y2="290" stroke="#2e7d32" stroke-width="1" stroke-dasharray="5,3" opacity="0.4"/>
</svg>
