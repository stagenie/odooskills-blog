<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" preserveAspectRatio="xMidYMid meet" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="gradModel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#875A7B"/>
      <stop offset="1" stop-color="#6B4762"/>
    </linearGradient>
    <linearGradient id="gradTransient" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#17A2B8"/>
      <stop offset="1" stop-color="#0F7A8C"/>
    </linearGradient>
    <linearGradient id="gradAbstract" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FD7E14"/>
      <stop offset="1" stop-color="#C25F0A"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#F8F9FA"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#212529">Les 3 types de modèles Odoo 19</text>
  <text x="450" y="64" text-anchor="middle" font-size="14" fill="#6C757D">Comparaison : stockage, durée de vie et usage</text>

  <!-- Model -->
  <g>
    <rect x="40" y="100" width="260" height="380" rx="12" fill="white" stroke="#875A7B" stroke-width="2"/>
    <rect x="40" y="100" width="260" height="60" rx="12" fill="url(#gradModel)"/>
    <text x="170" y="128" text-anchor="middle" font-size="18" font-weight="bold" fill="white">models.Model</text>
    <text x="170" y="148" text-anchor="middle" font-size="12" fill="#E9D5E0">modèle persistant</text>

    <text x="60" y="190" font-size="13" font-weight="bold" fill="#333">Stockage</text>
    <text x="60" y="210" font-size="12" fill="#555">Table PostgreSQL créée</text>
    <text x="60" y="228" font-size="12" fill="#555">dédiée</text>

    <text x="60" y="260" font-size="13" font-weight="bold" fill="#333">Durée de vie</text>
    <text x="60" y="280" font-size="12" fill="#555">Illimitée</text>

    <text x="60" y="312" font-size="13" font-weight="bold" fill="#333">Usage typique</text>
    <text x="60" y="332" font-size="12" fill="#555">Données métier : clients,</text>
    <text x="60" y="350" font-size="12" fill="#555">tickets, commandes...</text>

    <text x="60" y="382" font-size="13" font-weight="bold" fill="#333">Exemple T08</text>
    <text x="60" y="402" font-size="12" fill="#875A7B" font-family="monospace">helpdesk.ticket</text>
    <text x="60" y="420" font-size="12" fill="#875A7B" font-family="monospace">helpdesk.ticket.category</text>

    <text x="60" y="452" font-size="11" fill="#6C757D" font-style="italic">→ 90% des modèles</text>
    <text x="60" y="468" font-size="11" fill="#6C757D" font-style="italic">que tu vas écrire</text>
  </g>

  <!-- TransientModel -->
  <g>
    <rect x="320" y="100" width="260" height="380" rx="12" fill="white" stroke="#17A2B8" stroke-width="2"/>
    <rect x="320" y="100" width="260" height="60" rx="12" fill="url(#gradTransient)"/>
    <text x="450" y="128" text-anchor="middle" font-size="18" font-weight="bold" fill="white">models.TransientModel</text>
    <text x="450" y="148" text-anchor="middle" font-size="12" fill="#C7EAF1">modèle temporaire</text>

    <text x="340" y="190" font-size="13" font-weight="bold" fill="#333">Stockage</text>
    <text x="340" y="210" font-size="12" fill="#555">Table PostgreSQL purgée</text>
    <text x="340" y="228" font-size="12" fill="#555">par un cron (vacuum)</text>

    <text x="340" y="260" font-size="13" font-weight="bold" fill="#333">Durée de vie</text>
    <text x="340" y="280" font-size="12" fill="#555">Quelques heures max</text>

    <text x="340" y="312" font-size="13" font-weight="bold" fill="#333">Usage typique</text>
    <text x="340" y="332" font-size="12" fill="#555">Wizards (dialogues</text>
    <text x="340" y="350" font-size="12" fill="#555">modaux à étapes)</text>

    <text x="340" y="382" font-size="13" font-weight="bold" fill="#333">Exemple T08</text>
    <text x="340" y="402" font-size="12" fill="#17A2B8" font-family="monospace">helpdesk.ticket.close.</text>
    <text x="340" y="420" font-size="12" fill="#17A2B8" font-family="monospace">wizard</text>

    <text x="340" y="452" font-size="11" fill="#6C757D" font-style="italic">→ Pour tout formulaire</text>
    <text x="340" y="468" font-size="11" fill="#6C757D" font-style="italic">qui ne persiste pas</text>
  </g>

  <!-- AbstractModel -->
  <g>
    <rect x="600" y="100" width="260" height="380" rx="12" fill="white" stroke="#FD7E14" stroke-width="2"/>
    <rect x="600" y="100" width="260" height="60" rx="12" fill="url(#gradAbstract)"/>
    <text x="730" y="128" text-anchor="middle" font-size="18" font-weight="bold" fill="white">models.AbstractModel</text>
    <text x="730" y="148" text-anchor="middle" font-size="12" fill="#FCE1CB">mixin réutilisable</text>

    <text x="620" y="190" font-size="13" font-weight="bold" fill="#333">Stockage</text>
    <text x="620" y="210" font-size="12" fill="#555">AUCUNE table créée</text>
    <text x="620" y="228" font-size="12" fill="#555">en base</text>

    <text x="620" y="260" font-size="13" font-weight="bold" fill="#333">Durée de vie</text>
    <text x="620" y="280" font-size="12" fill="#555">N/A (pas de records)</text>

    <text x="620" y="312" font-size="13" font-weight="bold" fill="#333">Usage typique</text>
    <text x="620" y="332" font-size="12" fill="#555">Mutualiser champs et</text>
    <text x="620" y="350" font-size="12" fill="#555">méthodes entre modèles</text>

    <text x="620" y="382" font-size="13" font-weight="bold" fill="#333">Exemple T08</text>
    <text x="620" y="402" font-size="12" fill="#FD7E14" font-family="monospace">odooskills.helpdesk.</text>
    <text x="620" y="420" font-size="12" fill="#FD7E14" font-family="monospace">mixin</text>

    <text x="620" y="452" font-size="11" fill="#6C757D" font-style="italic">→ mail.thread et</text>
    <text x="620" y="468" font-size="11" fill="#6C757D" font-style="italic">mail.activity.mixin</text>
  </g>

  <!-- Bottom band -->
  <rect x="40" y="500" width="820" height="40" rx="8" fill="#E9ECEF"/>
  <text x="450" y="525" text-anchor="middle" font-size="13" fill="#495057">
    <tspan font-weight="bold">Règle simple :</tspan> données durables → Model &nbsp;•&nbsp; formulaire éphémère → TransientModel &nbsp;•&nbsp; code partagé → AbstractModel
  </text>
</svg>
