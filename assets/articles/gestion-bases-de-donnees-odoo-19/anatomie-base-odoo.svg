<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="pgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#336791;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#264f73;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="fsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#388E3C;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="backupGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#E65100;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/></filter>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#999"/></marker>
    <marker id="arrowD" markerWidth="6" markerHeight="8" refX="3" refY="8" orient="auto"><polygon points="0 0,3 8,6 0" fill="#999"/></marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" fill="#333" font-size="17" font-weight="bold">Anatomie d'une base Odoo 19</text>

  <!-- PostgreSQL DB -->
  <rect x="30" y="50" width="350" height="240" rx="14" fill="url(#pgGrad)" filter="url(#shadow)"/>
  <text x="205" y="82" text-anchor="middle" fill="white" font-size="17" font-weight="bold">PostgreSQL Database</text>
  <line x1="55" y1="95" x2="355" y2="95" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

  <!-- Tables inside PG -->
  <rect x="50" y="108" width="145" height="32" rx="5" fill="rgba(255,255,255,0.15)"/>
  <text x="122" y="129" text-anchor="middle" fill="white" font-size="11">res_partner</text>
  <rect x="205" y="108" width="155" height="32" rx="5" fill="rgba(255,255,255,0.15)"/>
  <text x="282" y="129" text-anchor="middle" fill="white" font-size="11">sale_order</text>
  <rect x="50" y="150" width="145" height="32" rx="5" fill="rgba(255,255,255,0.15)"/>
  <text x="122" y="171" text-anchor="middle" fill="white" font-size="11">account_move</text>
  <rect x="205" y="150" width="155" height="32" rx="5" fill="rgba(255,255,255,0.15)"/>
  <text x="282" y="171" text-anchor="middle" fill="white" font-size="11">helpdesk_ticket</text>
  <rect x="50" y="192" width="145" height="32" rx="5" fill="rgba(255,255,255,0.15)"/>
  <text x="122" y="213" text-anchor="middle" fill="white" font-size="11">ir_ui_view</text>
  <rect x="205" y="192" width="155" height="32" rx="5" fill="rgba(255,255,255,0.15)"/>
  <text x="282" y="213" text-anchor="middle" fill="white" font-size="11">ir_attachment</text>

  <text x="205" y="255" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">~400 tables (installation standard)</text>
  <text x="205" y="275" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="10">Sauvegarde : pg_dump → fichier .sql ou .dump</text>

  <!-- Filestore -->
  <rect x="430" y="50" width="200" height="240" rx="14" fill="url(#fsGrad)" filter="url(#shadow)"/>
  <text x="530" y="82" text-anchor="middle" fill="white" font-size="17" font-weight="bold">Filestore</text>
  <line x1="450" y1="95" x2="610" y2="95" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="530" y="120" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="12">Fichiers binaires</text>
  <text x="530" y="145" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11">Images produits</text>
  <text x="530" y="165" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11">Pièces jointes</text>
  <text x="530" y="185" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11">Rapports PDF</text>
  <text x="530" y="205" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="11">Assets web (JS, CSS)</text>
  <rect x="450" y="222" width="160" height="46" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="530" y="243" text-anchor="middle" fill="white" font-size="10">/var/lib/odoo/filestore/</text>
  <text x="530" y="258" text-anchor="middle" fill="white" font-size="10">ou ~/.local/share/Odoo/</text>

  <!-- Arrow PG <-> Filestore -->
  <line x1="380" y1="170" x2="430" y2="170" stroke="#999" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="405" y="162" text-anchor="middle" fill="#666" font-size="9">checksum</text>

  <!-- Backup box -->
  <rect x="680" y="70" width="160" height="200" rx="14" fill="url(#backupGrad)" filter="url(#shadow)"/>
  <text x="760" y="100" text-anchor="middle" fill="white" font-size="16" font-weight="bold">Sauvegarde</text>
  <line x1="700" y1="112" x2="820" y2="112" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="760" y="138" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="12">Complète =</text>
  <text x="760" y="160" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="11">pg_dump (.sql)</text>
  <text x="760" y="178" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">+</text>
  <text x="760" y="196" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="11">filestore/ (tar)</text>
  <rect x="700" y="215" width="120" height="32" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="760" y="236" text-anchor="middle" fill="white" font-size="11" font-weight="600">Les 2 sont requis</text>

  <!-- Arrows to backup -->
  <line x1="380" y1="100" x2="680" y2="100" stroke="#999" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowR)"/>
  <line x1="630" y1="200" x2="680" y2="200" stroke="#999" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowR)"/>
</svg>