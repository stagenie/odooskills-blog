<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 200" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <!-- Title -->
  <text x="375" y="25" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Livraison en 2 étapes</text>

  <!-- Step 1: Stock -->
  <rect x="30" y="55" width="160" height="70" rx="10" fill="#198754" stroke="#157347" stroke-width="2"/>
  <text x="110" y="82" text-anchor="middle" fill="white" font-weight="bold">ALG / Stock</text>
  <text x="110" y="102" text-anchor="middle" fill="#d1e7dd" font-size="12">Produits disponibles</text>

  <!-- Arrow 1 -->
  <line x1="190" y1="90" x2="250" y2="90" stroke="#714B67" stroke-width="3" marker-end="url(#arrowPurple2)"/>
  <text x="220" y="78" text-anchor="middle" font-size="11" fill="#714B67" font-weight="bold">PICK</text>

  <!-- Step 2: Sortie -->
  <rect x="250" y="55" width="160" height="70" rx="10" fill="#0dcaf0" stroke="#0aa2c0" stroke-width="2"/>
  <text x="330" y="82" text-anchor="middle" fill="white" font-weight="bold">ALG / Sortie</text>
  <text x="330" y="102" text-anchor="middle" fill="#e0f7fa" font-size="12">Zone de préparation</text>

  <!-- Arrow 2 -->
  <line x1="410" y1="90" x2="470" y2="90" stroke="#714B67" stroke-width="3" marker-end="url(#arrowPurple2)"/>
  <text x="440" y="78" text-anchor="middle" font-size="11" fill="#714B67" font-weight="bold">OUT</text>

  <!-- Step 3: Client -->
  <rect x="470" y="55" width="160" height="70" rx="10" fill="#6c757d" stroke="#5a6268" stroke-width="2"/>
  <text x="550" y="82" text-anchor="middle" fill="white" font-weight="bold">Client</text>
  <text x="550" y="102" text-anchor="middle" fill="#ddd" font-size="12">Réseau Plus</text>

  <!-- Labels underneath -->
  <text x="110" y="155" text-anchor="middle" font-size="12" fill="#198754">Étape 1</text>
  <text x="330" y="155" text-anchor="middle" font-size="12" fill="#0dcaf0">Étape 2</text>
  <text x="550" y="155" text-anchor="middle" font-size="12" fill="#888">Externe</text>

  <!-- Dashed grouping -->
  <rect x="20" y="42" width="400" height="100" rx="12" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="220" y="170" text-anchor="middle" font-size="11" fill="#999">Entrepôt Alger (ALG)</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowPurple2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#714B67"/>
    </marker>
  </defs>
</svg>
