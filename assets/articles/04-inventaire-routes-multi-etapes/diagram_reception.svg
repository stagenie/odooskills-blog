<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <!-- Title -->
  <text x="450" y="25" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Réception en 3 étapes</text>

  <!-- Step 1: Fournisseur -->
  <rect x="20" y="55" width="160" height="70" rx="10" fill="#6c757d" stroke="#5a6268" stroke-width="2"/>
  <text x="100" y="85" text-anchor="middle" fill="white" font-weight="bold">Fournisseur</text>
  <text x="100" y="105" text-anchor="middle" fill="#ddd" font-size="12">TechDistrib</text>

  <!-- Arrow 1 -->
  <line x1="180" y1="90" x2="225" y2="90" stroke="#714B67" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <text x="202" y="78" text-anchor="middle" font-size="11" fill="#714B67" font-weight="bold">IN</text>

  <!-- Step 2: Entrée -->
  <rect x="225" y="55" width="160" height="70" rx="10" fill="#0d6efd" stroke="#0b5ed7" stroke-width="2"/>
  <text x="305" y="82" text-anchor="middle" fill="white" font-weight="bold">ALG / Entrée</text>
  <text x="305" y="102" text-anchor="middle" fill="#cfe2ff" font-size="12">Zone de déchargement</text>

  <!-- Arrow 2 -->
  <line x1="385" y1="90" x2="430" y2="90" stroke="#714B67" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <text x="407" y="78" text-anchor="middle" font-size="11" fill="#714B67" font-weight="bold">QC</text>

  <!-- Step 3: Contrôle qualité -->
  <rect x="430" y="55" width="160" height="70" rx="10" fill="#fd7e14" stroke="#e8690a" stroke-width="2"/>
  <text x="510" y="82" text-anchor="middle" fill="white" font-weight="bold">ALG / Contrôle</text>
  <text x="510" y="102" text-anchor="middle" fill="#ffe5d0" font-size="12">Inspection matériel</text>

  <!-- Arrow 3 -->
  <line x1="590" y1="90" x2="635" y2="90" stroke="#714B67" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <text x="612" y="78" text-anchor="middle" font-size="11" fill="#714B67" font-weight="bold">STOR</text>

  <!-- Step 4: Stock -->
  <rect x="635" y="55" width="160" height="70" rx="10" fill="#198754" stroke="#157347" stroke-width="2"/>
  <text x="715" y="82" text-anchor="middle" fill="white" font-weight="bold">ALG / Stock</text>
  <text x="715" y="102" text-anchor="middle" fill="#d1e7dd" font-size="12">Disponible en stock</text>

  <!-- Labels underneath -->
  <text x="100" y="155" text-anchor="middle" font-size="12" fill="#888">Externe</text>
  <text x="305" y="155" text-anchor="middle" font-size="12" fill="#0d6efd">Étape 1</text>
  <text x="510" y="155" text-anchor="middle" font-size="12" fill="#fd7e14">Étape 2</text>
  <text x="715" y="155" text-anchor="middle" font-size="12" fill="#198754">Étape 3</text>

  <!-- Dashed grouping -->
  <rect x="215" y="42" width="590" height="100" rx="12" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="510" y="170" text-anchor="middle" font-size="11" fill="#999">Entrepôt Alger (ALG)</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#714B67"/>
    </marker>
  </defs>
</svg>
