<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="pgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#336791;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#264f73;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="odooGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#714B67;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#5a3a52;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="browserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0078D4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#005a9e;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- PostgreSQL Box -->
  <rect x="20" y="40" width="220" height="240" rx="12" fill="url(#pgGrad)" filter="url(#shadow)"/>
  <text x="130" y="80" text-anchor="middle" fill="white" font-size="18" font-weight="bold">PostgreSQL 16</text>
  <line x1="50" y1="95" x2="210" y2="95" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="130" y="120" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="13">SGBD relationnel</text>
  <text x="130" y="148" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12">Port 5432</text>
  <text x="130" y="172" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12">Utilisateur : odoo19</text>
  <text x="130" y="196" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12">Mot de passe : odoo19</text>
  <rect x="50" y="218" width="160" height="36" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="130" y="241" text-anchor="middle" fill="white" font-size="12" font-weight="600">pgAdmin 4 inclus</text>

  <!-- Odoo Box -->
  <rect x="290" y="40" width="220" height="240" rx="12" fill="url(#odooGrad)" filter="url(#shadow)"/>
  <text x="400" y="80" text-anchor="middle" fill="white" font-size="18" font-weight="bold">odoo-bin</text>
  <line x1="320" y1="95" x2="480" y2="95" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="400" y="120" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="13">Python 3.12 (venv)</text>
  <text x="400" y="148" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12">Port HTTP : 8069</text>
  <text x="400" y="172" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12">Port longpolling : 8072</text>
  <text x="400" y="196" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12">odoo.conf</text>
  <rect x="320" y="218" width="160" height="36" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="400" y="241" text-anchor="middle" fill="white" font-size="12" font-weight="600">C:\odoo19\</text>

  <!-- Browser Box -->
  <rect x="560" y="40" width="220" height="240" rx="12" fill="url(#browserGrad)" filter="url(#shadow)"/>
  <text x="670" y="80" text-anchor="middle" fill="white" font-size="18" font-weight="bold">Navigateur</text>
  <line x1="590" y1="95" x2="750" y2="95" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="670" y="120" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="13">http://localhost:8069</text>
  <text x="670" y="148" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12">JavaScript / OWL</text>
  <text x="670" y="172" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12">HTML / CSS / QWeb</text>
  <rect x="590" y="218" width="160" height="36" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="670" y="241" text-anchor="middle" fill="white" font-size="12" font-weight="600">Edge / Chrome / Firefox</text>

  <!-- Arrows PostgreSQL <-> Odoo -->
  <line x1="240" y1="140" x2="290" y2="140" stroke="#e0e0e0" stroke-width="2" marker-end="url(#arrowRight)"/>
  <line x1="290" y1="180" x2="240" y2="180" stroke="#e0e0e0" stroke-width="2" marker-end="url(#arrowLeft)"/>
  <text x="265" y="132" text-anchor="middle" fill="#888" font-size="10">SQL</text>
  <text x="265" y="198" text-anchor="middle" fill="#888" font-size="10">ORM</text>

  <!-- Arrows Odoo <-> Browser -->
  <line x1="510" y1="140" x2="560" y2="140" stroke="#e0e0e0" stroke-width="2" marker-end="url(#arrowRight)"/>
  <line x1="560" y1="180" x2="510" y2="180" stroke="#e0e0e0" stroke-width="2" marker-end="url(#arrowLeft)"/>
  <text x="535" y="132" text-anchor="middle" fill="#888" font-size="10">JSON</text>
  <text x="535" y="198" text-anchor="middle" fill="#888" font-size="10">HTTP</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowRight" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e0e0e0"/>
    </marker>
    <marker id="arrowLeft" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#e0e0e0"/>
    </marker>
  </defs>
</svg>